<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --loam:#1C1512; --clay:#251C18; --rail:#3A2C25;
  --dust:#E8DCC8; --slate:#8B7A6C; --sodium:#F2A73B;
  --flag-green:#3FA34D; --flag-red:#C4342B; --flag-yellow:#E5C34A;
  --disp:"Saira Condensed",system-ui,sans-serif;
  --body:"Saira",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:1.45vh}
body{
  background:var(--loam);color:var(--dust);font-family:var(--body);
  height:100vh;overflow:hidden;
  background-image:radial-gradient(120% 80% at 50% -10%, rgba(242,167,59,.09), transparent 60%);
}
.board{height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:.9rem;padding:1.1rem 1.3rem}

/* masthead */
.masthead{display:flex;align-items:flex-end;gap:1.6rem;border-bottom:2px solid var(--rail);padding-bottom:.7rem}
.mast-clock{font-family:var(--mono);font-size:4.6rem;font-weight:700;line-height:.85;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mast-clock .mer{font-size:1.5rem;color:var(--slate);margin-left:.4rem;letter-spacing:0}
.mast-when{padding-bottom:.35rem}
.mast-day{font-family:var(--disp);font-size:2.5rem;font-weight:700;line-height:.9;letter-spacing:.02em;color:var(--sodium)}
.mast-date{font-family:var(--mono);font-size:1rem;color:var(--slate);letter-spacing:.18em;margin-top:.25rem}
.mast-fill{flex:1}
.mast-now{display:flex;align-items:flex-end;gap:1.4rem;padding-bottom:.35rem}
.now-temp{font-family:var(--disp);font-size:3.8rem;font-weight:700;line-height:.85}
.now-temp sup{font-size:1.4rem;vertical-align:super;color:var(--slate)}
.now-meta{text-align:right;line-height:1.5}
.now-cond{font-family:var(--disp);font-size:1.5rem;font-weight:600;letter-spacing:.03em}
.now-sub{font-family:var(--mono);font-size:.85rem;color:var(--slate);letter-spacing:.08em}

/* grid */
.grid{display:grid;grid-template-columns:1.45fr 1fr 1fr;grid-template-rows:1.25fr 1fr;gap:.9rem;min-height:0}
.hero{grid-row:span 2}
.panel{background:var(--clay);border:1px solid var(--rail);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;padding:.7rem .95rem .55rem;border-bottom:1px solid var(--rail);flex-shrink:0}
.panel-label{font-family:var(--mono);font-size:.8rem;font-weight:700;letter-spacing:.22em;color:var(--slate)}
.panel-note{font-family:var(--mono);font-size:.78rem;color:var(--rail);letter-spacing:.1em}
.panel-body{padding:.85rem .95rem;flex:1;min-height:0;display:flex;flex-direction:column}

/* the flag bar */
.flag{height:2.6rem;flex-shrink:0;display:flex;align-items:center;padding:0 .95rem;font-family:var(--disp);font-size:1.5rem;font-weight:700;letter-spacing:.16em;color:var(--loam);position:relative}
.flag::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 55%);pointer-events:none}
.flag--green{background:var(--flag-green)}
.flag--red{background:var(--flag-red);color:#F6EDE4}
.flag--yellow{background:var(--flag-yellow)}
.flag--standby{background:transparent;color:var(--slate);border-bottom:1px solid var(--rail);font-size:1.15rem}
.flag--standby::after{display:none}
.flag-right{margin-left:auto;font-family:var(--mono);font-size:.85rem;letter-spacing:.12em;opacity:.85}

/* hero */
.hero-body{padding:1.1rem .95rem .95rem;flex:1;display:flex;flex-direction:column;min-height:0}
.hero-eyebrow{font-family:var(--mono);font-size:.82rem;letter-spacing:.22em;color:var(--slate)}
.hero-title{font-family:var(--disp);font-size:4.1rem;font-weight:700;line-height:.92;margin-top:.2rem}
.hero-sub{font-size:1.15rem;color:var(--slate);margin-top:.35rem;line-height:1.4}
.hero-big{font-family:var(--disp);font-size:7.4rem;font-weight:700;line-height:.82;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:.3rem}
.hero-big small{font-size:1.9rem;color:var(--slate);letter-spacing:.02em;margin-left:.5rem}

/* sessions chart */
.chart{display:flex;gap:.5rem;align-items:flex-end;flex:1;min-height:0;margin-top:1rem;padding-bottom:.3rem}
.chart-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:.35rem;height:100%}
.chart-bar{width:100%;background:var(--rail);position:relative;min-height:2px}
.chart-bar i{position:absolute;left:0;right:0;bottom:0;background:var(--sodium);display:block}
.chart-col:last-child .chart-bar i{background:var(--dust)}
.chart-v{font-family:var(--mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.chart-d{font-family:var(--mono);font-size:.7rem;color:var(--slate)}

/* lineup */
.lineup{margin-top:auto;border-top:1px solid var(--rail)}
.lineup-row{display:grid;grid-template-columns:.5rem 1fr auto auto;align-items:center;gap:.85rem;padding:.65rem 0;border-bottom:1px solid rgba(58,44,37,.6)}
.lineup-row:last-child{border-bottom:0}
.dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--rail)}
.dot--green{background:var(--flag-green)}
.dot--red{background:var(--flag-red)}
.dot--yellow{background:var(--flag-yellow)}
.lineup-name{font-family:var(--disp);font-size:1.5rem;font-weight:600}
.lineup-name span{display:block;font-family:var(--mono);font-size:.72rem;color:var(--slate);letter-spacing:.14em;font-weight:400}
.lineup-time{font-family:var(--mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
.lineup-state{font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;padding:.2rem .5rem;border:1px solid var(--rail);color:var(--slate);min-width:6.5rem;text-align:center}
.lineup-state.is-go{color:var(--flag-green);border-color:var(--flag-green)}
.lineup-state.is-out{color:var(--flag-red);border-color:var(--flag-red)}
.lineup-state.is-watch{color:var(--flag-yellow);border-color:var(--flag-yellow)}

.hero-stats{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;border-top:1px solid var(--rail);padding-top:.85rem}
.stat-k{font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;color:var(--slate)}
.stat-v{font-family:var(--disp);font-size:2.5rem;font-weight:700;line-height:1;margin-top:.15rem;font-variant-numeric:tabular-nums}
.stat-v em{font-style:normal;font-size:1rem;color:var(--slate);margin-left:.25rem}

/* calendar */
.cal-list{display:flex;flex-direction:column;gap:.55rem;overflow:hidden}
.cal-item{display:grid;grid-template-columns:4.2rem 1fr;gap:.75rem;align-items:baseline}
.cal-time{font-family:var(--mono);font-size:.88rem;color:var(--sodium);font-variant-numeric:tabular-nums}
.cal-time.is-allday{color:var(--slate)}
.cal-title{font-size:1.05rem;line-height:1.25}
.cal-where{display:block;font-family:var(--mono);font-size:.75rem;color:var(--slate);letter-spacing:.06em;margin-top:.1rem}
.cal-rule{border-top:1px dashed var(--rail);margin:.35rem 0 .1rem;padding-top:.5rem}
.cal-rule-label{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;color:var(--rail)}
.empty{font-family:var(--mono);font-size:.85rem;color:var(--rail);letter-spacing:.12em;margin:auto;text-align:center}

/* weather */
.wx-strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rail);flex-shrink:0}
.wx-cell{padding:.55rem .5rem;border-right:1px solid var(--rail);text-align:center}
.wx-cell:last-child{border-right:0}
.wx-k{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;color:var(--slate)}
.wx-v{font-family:var(--disp);font-size:1.75rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.wx-hours{display:flex;gap:.4rem;margin-top:.75rem;align-items:flex-end;flex:1;min-height:0}
.wx-hour{flex:1;display:flex;flex-direction:column;align-items:center;gap:.3rem;justify-content:flex-end;height:100%}
.wx-bar{width:100%;background:var(--rail);position:relative}
.wx-bar i{position:absolute;left:0;right:0;bottom:0;background:var(--sodium);display:block}
.wx-hr{font-family:var(--mono);font-size:.68rem;color:var(--slate)}
.wx-deg{font-family:var(--mono);font-size:.78rem;font-variant-numeric:tabular-nums}
.wx-quip{font-size:.95rem;color:var(--slate);border-top:1px solid var(--rail);padding-top:.6rem;margin-top:.7rem;line-height:1.35}

/* news */
.news-list{display:flex;flex-direction:column;gap:.7rem;overflow:hidden}
.news-item{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:baseline}
.news-src{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;color:var(--loam);background:var(--slate);padding:.12rem .38rem;white-space:nowrap}
.news-head{font-size:1rem;line-height:1.3}
.news-age{font-family:var(--mono);font-size:.72rem;color:var(--rail);margin-left:.4rem}

/* projects */
.proj-grid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;flex:1;align-content:center}
.proj-k{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;color:var(--slate)}
.proj-v{font-family:var(--disp);font-size:2.3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.proj-v em{font-style:normal;font-size:.95rem;color:var(--sodium);margin-left:.3rem}

/* ticker */
.ticker{border-top:2px solid var(--rail);padding-top:.55rem;display:flex;align-items:center;gap:.9rem;overflow:hidden}
.ticker-tag{font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:.2em;color:var(--loam);background:var(--sodium);padding:.2rem .5rem;flex-shrink:0}
.ticker-tag.is-bad{background:var(--flag-red);color:#F6EDE4}
.ticker-track{flex:1;overflow:hidden;white-space:nowrap;min-width:0}
.ticker-run{display:inline-block;animation:run 46s linear infinite;padding-left:100%}
.ticker-run span{font-family:var(--mono);font-size:.82rem;letter-spacing:.09em;color:var(--slate)}
.ticker-run span::before{content:"\25C6";color:var(--rail);margin:0 1.4rem}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ticker-run{animation:none;padding-left:0}}

@media (max-aspect-ratio:1/1){
  html{font-size:15px}
  body{overflow:auto;height:auto}
  .board{height:auto;grid-template-rows:none}
  .grid{grid-template-columns:1fr;grid-template-rows:none}
  .hero{grid-row:auto}
  .hero-big{font-size:5rem}.hero-title{font-size:2.6rem}.mast-clock{font-size:3rem}
}
</style>
</head>
<body>
<div class="board">
  <header class="masthead">
    <div class="mast-when">
      <div class="mast-day" id="day">&mdash;</div>
      <div class="mast-date" id="date">&mdash;</div>
    </div>
    <div class="mast-clock" id="clock">&mdash;</div>
    <div class="mast-fill"></div>
    <div class="mast-now">
      <div class="now-temp" id="nowTemp">&mdash;</div>
      <div class="now-meta">
        <div class="now-cond" id="nowCond">&nbsp;</div>
        <div class="now-sub" id="nowSub">SCHENECTADY</div>
      </div>
    </div>
  </header>

  <main class="grid">
    <section class="panel hero">
      <div class="flag flag--standby" id="flag">LOADING</div>
      <div class="hero-body" id="heroBody"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><span class="panel-label">ON THE BOOKS</span><span class="panel-note">CALENDAR</span></div>
      <div class="panel-body"><div class="cal-list" id="calList"><p class="empty">LOADING</p></div></div>
    </section>

    <section class="panel">
      <div class="panel-head"><span class="panel-label">SKY</span><span class="panel-note">OPEN-METEO</span></div>
      <div class="panel-body" id="wxBody"><p class="empty">LOADING</p></div>
    </section>

    <section class="panel">
      <div class="panel-head"><span class="panel-label" id="projLabel">&nbsp;</span><span class="panel-note" id="projNote">&nbsp;</span></div>
      <div class="panel-body"><div class="proj-grid" id="projGrid"></div></div>
    </section>

    <section class="panel">
      <div class="panel-head"><span class="panel-label">WIRE</span><span class="panel-note">RSS</span></div>
      <div class="panel-body"><div class="news-list" id="newsList"><p class="empty">LOADING</p></div></div>
    </section>
  </main>

  <footer class="ticker">
    <span class="ticker-tag" id="tickerTag">SYSTEMS</span>
    <div class="ticker-track"><div class="ticker-run" id="tickerRun"></div></div>
  </footer>
</div>

<script>
/* =====================================================================
   Sources. Weather, DirtCheck and BathroomReport all send CORS headers, so
   the page fetches them straight from the browser. News and calendar can't
   be, so cron drops them in /data/ and we read them off localhost.
   ===================================================================== */
const LAT = 42.8142, LON = -73.9396;
const WEATHER = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON
  + "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m"
  + "&hourly=temperature_2m,precipitation_probability"
  + "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max"
  + "&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=2";
const DIRT = "https://dschmiedel25.github.io/dirtcheck/data";
const BATH = "https://bathroomreport.app/analytics-data.json";
const NEWS = ["/data/news1.xml", "/data/news2.xml"];
const CAL  = "/data/next.json";

const REFRESH_MS = 5 * 60 * 1000;
const $ = function (id) { return document.getElementById(id); };
const esc = function (s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
  });
};
const num = function (n) { return Number(n || 0).toLocaleString(); };

async function grab(url, type) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status + " " + url);
  return type === "text" ? r.text() : r.json();
}

/* ---------------------------------------------------- weather ---- */
function wmo(c) {
  if (c === 0) return "Clear";
  if (c <= 2) return "Partly cloudy";
  if (c === 3) return "Cloudy";
  if (c <= 48) return "Fog";
  if (c <= 57) return "Drizzle";
  if (c <= 67) return "Rain";
  if (c <= 77) return "Snow";
  if (c <= 82) return "Showers";
  if (c <= 86) return "Snow";
  return "Storms";
}

function quip(cur, dayMax, hours) {
  const wet = hours.filter(function (h) { return h.p >= 50; });
  if (cur.weather_code >= 95) return "Storms in the area. Anything outdoors is a gamble.";
  if (cur.weather_code >= 51) return "Raining now. The tracks won't like it either.";
  if (wet.length) return "Dry for now, but " + wet[0].label + " is showing " + wet[0].p + "% \u2014 worth watching.";
  if (dayMax >= 40) return "Rain chance climbing later. Keep an eye on it.";
  if (cur.temperature_2m >= 88) return "Hot one. Drink more water than you think you need.";
  return "Clear sailing. Nothing in the way today.";
}

function renderWeather(w) {
  const cur = w.current;
  const high = Math.round(w.daily.temperature_2m_max[0]);
  const rain = w.daily.precipitation_probability_max[0] || 0;

  $("nowTemp").innerHTML = Math.round(cur.temperature_2m) + "<sup>&deg;</sup>";
  $("nowCond").textContent = wmo(cur.weather_code);
  $("nowSub").textContent = "SCHENECTADY \u00B7 FEELS " + Math.round(cur.apparent_temperature) + "\u00B0";

  // eight slots at two-hour spacing, starting from the current hour
  const now = new Date();
  let idx = w.hourly.time.findIndex(function (t) { return new Date(t) >= now; });
  if (idx < 0) idx = 0;
  const hours = [];
  for (let i = idx; i < w.hourly.time.length && hours.length < 8; i += 2) {
    const d = new Date(w.hourly.time[i]);
    const h = d.getHours();
    hours.push({
      label: (h % 12 || 12) + (h < 12 ? "A" : "P"),
      t: Math.round(w.hourly.temperature_2m[i]),
      p: w.hourly.precipitation_probability[i] || 0
    });
  }
  const temps = hours.map(function (h) { return h.t; });
  const lo = Math.min.apply(null, temps) - 4, hi = Math.max.apply(null, temps) + 2;

  $("wxBody").innerHTML =
    '<div class="wx-strip">'
    + '<div class="wx-cell"><div class="wx-k">HIGH</div><div class="wx-v">' + high + "&deg;</div></div>"
    + '<div class="wx-cell"><div class="wx-k">RAIN</div><div class="wx-v">' + rain + "%</div></div>"
    + '<div class="wx-cell"><div class="wx-k">WIND</div><div class="wx-v">' + Math.round(cur.wind_speed_10m) + "</div></div>"
    + '<div class="wx-cell"><div class="wx-k">HUM</div><div class="wx-v">' + Math.round(cur.relative_humidity_2m) + "%</div></div>"
    + "</div>"
    + '<div class="wx-hours">'
    + hours.map(function (h) {
        const pct = Math.round((h.t - lo) / (hi - lo) * 100);
        return '<div class="wx-hour"><div class="wx-deg">' + h.t + "&deg;</div>"
          + '<div class="wx-bar" style="height:100%"><i style="height:' + pct + '%"></i></div>'
          + '<div class="wx-hr">' + h.label + "</div></div>";
      }).join("")
    + "</div>"
    + '<p class="wx-quip">' + esc(quip(cur, rain, hours)) + "</p>";
}

/* ---------------------------------------------------- dirtcheck ---- */
const OFF_WORDS = ["rain", "postpone", "cancel", "off"];
const ON_WORDS = ["green", "go", "racing", "run"];

function dirtState(st) {
  const fields = ["flag", "official"];
  for (let i = 0; i < fields.length; i++) {
    const v = st ? st[fields[i]] : null;
    if (!v) continue;
    const s = String(v).toLowerCase();
    if (OFF_WORDS.some(function (w) { return s.indexOf(w) >= 0; })) return "out";
    if (ON_WORDS.some(function (w) { return s.indexOf(w) >= 0; })) return "go";
    return "watch";
  }
  return null;
}

function localDate(d) { return d.toLocaleDateString("en-CA"); }

function dirtRead(events, status) {
  const today = localDate(new Date());
  const tracks = events.tracks || {};
  const sts = status.events || {};
  const races = (events.events || [])
    .filter(function (e) { return e.type === "race" && e.date >= today; })
    .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

  const todays = races.filter(function (e) { return e.date === today; }).map(function (e) {
    const st = sts[today + "|" + e.track] || {};
    const t = e.times || (tracks[e.track] || {}).defaults || {};
    const prob = st.prob == null ? null : st.prob;
    return {
      name: (tracks[e.track] || {}).short || e.track,
      title: e.title || "",
      gates: t.gates || "", hot: t.hotlaps || "",
      state: dirtState(st) || ((prob || 0) >= 40 ? "watch" : "go"),
      prob: prob
    };
  });

  const next = races.filter(function (e) { return e.date !== today; })[0] || races[0] || null;
  const nextSt = next ? (sts[next.date + "|" + next.track] || {}) : {};

  return {
    todays: todays,
    next: next,
    nextName: next ? ((tracks[next.track] || {}).short || next.track) : "",
    nextTimes: next ? (next.times || (tracks[next.track] || {}).defaults || {}) : {},
    nextProb: nextSt.prob == null ? null : nextSt.prob,
    left: races.length,
    total: (events.events || []).filter(function (e) { return e.type === "race"; }).length
  };
}

function countdown(dateStr, timeStr) {
  if (!dateStr) return "";
  const hm = (timeStr || "18:00").split(":");
  const ymd = dateStr.split("-");
  const target = new Date(+ymd[0], +ymd[1] - 1, +ymd[2], +hm[0], +hm[1]);
  const secs = (target - new Date()) / 1000;
  if (secs < 0) return "NOW";
  const d = Math.floor(secs / 86400);
  const h = Math.floor((secs % 86400) / 3600);
  const m = Math.floor((secs % 3600) / 60);
  return d ? d + "D " + h + "H" : h ? h + "H " + m + "M" : m + "M";
}

/* ---------------------------------------------------- bathroom ---- */
function bathRead(doc) {
  const ga = doc.ga4 || {}, daily = ga.daily || {};
  const days = Object.keys(daily).sort();
  const recent = days.slice(-7);
  const series = recent.map(function (d) {
    return { d: d, v: daily[d].sessions || 0, u: daily[d].activeUsers || 0 };
  });
  const last = daily[days[days.length - 1]] || {};
  const prev = daily[days[days.length - 2]] || {};
  const junk = ["(direct)", "(not set)", "(none)", "test", "qr"];
  const top = (ga.sources || [])
    .filter(function (s) { return junk.indexOf(String(s.source || "").toLowerCase()) < 0; })
    .sort(function (a, b) { return b.sessions - a.sessions; })[0];
  const gen = doc.generated ? new Date(doc.generated) : null;

  return {
    series: series,
    day: days[days.length - 1] || "",
    users: last.activeUsers || 0,
    sessions: last.sessions || 0,
    views: last.pageViews || 0,
    delta: (last.activeUsers || 0) - (prev.activeUsers || 0),
    week: series.reduce(function (a, s) { return a + s.v; }, 0),
    topSource: (top && top.source) || "direct",
    topSessions: (top && top.sessions) || 0,
    signups: (ga.events && ga.events.sign_up) || 0,
    errors: (doc.errors || []).length,
    stale: gen ? (Date.now() - gen) > 36 * 3600 * 1000 : false,
    generated: gen
  };
}

/* ---------------------------------------------------- render ---- */
const STATE_LABEL = { go: "RACING", out: "RAINED OUT", watch: "WATCHING" };
const DOT = { go: "dot--green", out: "dot--red", watch: "dot--yellow" };

function shortTitle(t) {
  return String(t || "").split(/[\u2014\/+]/)[0].trim();
}

function renderHero(dirt, bath) {
  const flag = $("flag"), body = $("heroBody");

  if (dirt && dirt.todays.length) {
    const allOut = dirt.todays.every(function (t) { return t.state === "out"; });
    const lead = dirt.todays[0];
    const cls = allOut ? "flag--red" : lead.state === "watch" ? "flag--yellow" : "flag--green";
    const word = allOut ? "RED FLAG" : lead.state === "watch" ? "WATCHING SKY" : "GREEN FLAG";
    flag.className = "flag " + cls;
    flag.innerHTML = word + '<span class="flag-right">'
      + esc(countdown(localDate(new Date()), lead.hot)) + " TO HOT LAPS</span>";

    body.innerHTML =
      '<div class="hero-eyebrow">TONIGHT AT THE TRACK</div>'
      + '<div class="hero-title">' + esc(allOut ? "Nobody races tonight" : lead.name) + "</div>"
      + '<div class="hero-sub">' + esc(shortTitle(lead.title)) + "</div>"
      + '<div class="lineup">'
      + dirt.todays.map(function (t) {
          return '<div class="lineup-row"><span class="dot ' + DOT[t.state] + '"></span>'
            + '<div class="lineup-name">' + esc(t.name)
            + "<span>GATES " + esc(t.gates) + " \u00B7 HOT LAPS " + esc(t.hot) + "</span></div>"
            + '<div class="lineup-time">' + (t.prob == null ? "" : t.prob + "%") + "</div>"
            + '<div class="lineup-state is-' + t.state + '">' + STATE_LABEL[t.state] + "</div></div>";
        }).join("")
      + "</div>";
    return;
  }

  // no racing today: BathroomReport traffic leads
  flag.className = "flag flag--standby";
  flag.innerHTML = "NO RACING TONIGHT"
    + (dirt && dirt.next
        ? '<span class="flag-right">' + esc(dirt.nextName.toUpperCase()) + " IN "
          + esc(countdown(dirt.next.date, dirt.nextTimes.gates)) + "</span>"
        : "");

  if (!bath) { body.innerHTML = '<p class="empty">ANALYTICS UNAVAILABLE</p>'; return; }

  const max = Math.max.apply(null, bath.series.map(function (s) { return s.v; }).concat([1]));
  const dayLabel = bath.day
    ? new Date(bath.day + "T12:00").toLocaleDateString("en-US", { month: "long", day: "numeric" })
    : "the last day with data";
  const move = bath.delta === 0 ? "flat against the day before"
    : (bath.delta > 0 ? "up " : "down ") + Math.abs(bath.delta) + " from the day before";

  body.innerHTML =
    '<div class="hero-eyebrow">BATHROOMREPORT \u00B7 SESSIONS</div>'
    + '<div class="hero-big">' + num(bath.week) + "<small>last 7 days</small></div>"
    + '<div class="hero-sub">' + num(bath.users) + " active users on " + esc(dayLabel) + ", " + move + ".</div>"
    + '<div class="chart">'
    + bath.series.map(function (s) {
        const pct = Math.round(s.v / max * 100);
        const d = new Date(s.d + "T12:00");
        return '<div class="chart-col"><div class="chart-v">' + s.v + "</div>"
          + '<div class="chart-bar" style="height:100%"><i style="height:' + pct + '%"></i></div>'
          + '<div class="chart-d">' + d.toLocaleDateString("en-US", { weekday: "narrow" }) + "</div></div>";
      }).join("")
    + "</div>"
    + '<div class="hero-stats">'
    + '<div><div class="stat-k">TOP REFERRER</div><div class="stat-v">' + bath.topSessions
      + "<em>" + esc(String(bath.topSource).split(".")[0]) + "</em></div></div>"
    + '<div><div class="stat-k">PAGE VIEWS</div><div class="stat-v">' + num(bath.views) + "</div></div>"
    + '<div><div class="stat-k">SIGN-UPS</div><div class="stat-v">' + num(bath.signups) + "</div></div>"
    + "</div>";
}

function renderProjects(dirt, bath) {
  const racing = dirt && dirt.todays.length;
  $("projLabel").textContent = racing ? "BATHROOMREPORT" : "NEXT RACE";
  $("projNote").textContent = racing ? "GA4" : "DIRTCHECK";
  const grid = $("projGrid");

  if (racing) {
    if (!bath) { grid.innerHTML = '<p class="empty">NO DATA</p>'; return; }
    grid.innerHTML =
      '<div><div class="proj-k">SESSIONS 7D</div><div class="proj-v">' + num(bath.week) + "</div></div>"
      + '<div><div class="proj-k">USERS</div><div class="proj-v">' + num(bath.users) + "</div></div>"
      + '<div><div class="proj-k">PAGE VIEWS</div><div class="proj-v">' + num(bath.views) + "</div></div>"
      + '<div><div class="proj-k">TOP SOURCE</div><div class="proj-v">' + bath.topSessions
        + "<em>" + esc(String(bath.topSource).split(".")[0]) + "</em></div></div>";
    return;
  }

  if (!dirt || !dirt.next) { grid.innerHTML = '<p class="empty">SEASON OVER</p>'; return; }
  const n = dirt.next;
  const dayName = new Date(n.date + "T12:00").toLocaleDateString("en-US", { weekday: "short" }).toUpperCase();
  grid.innerHTML =
    '<div><div class="proj-k">' + esc(dirt.nextName.toUpperCase()) + '</div><div class="proj-v">'
      + dayName + "<em>gates " + esc(dirt.nextTimes.gates || "?") + "</em></div></div>"
    + '<div><div class="proj-k">RAIN RISK</div><div class="proj-v">'
      + (dirt.nextProb == null ? "\u2014" : dirt.nextProb) + "<em>%</em></div></div>"
    + '<div><div class="proj-k">EVENT</div><div class="proj-v" style="font-size:1.2rem;line-height:1.2">'
      + esc(shortTitle(n.title)) + "</div></div>"
    + '<div><div class="proj-k">EVENTS LEFT</div><div class="proj-v">' + dirt.left
      + "<em>of " + dirt.total + "</em></div></div>";
}

function renderCalendar(cal) {
  const el = $("calList");
  if (!cal) { el.innerHTML = '<p class="empty">CALENDAR UNAVAILABLE</p>'; return; }
  const today = cal.today || [], later = cal.later || [];
  if (!today.length && !later.length) { el.innerHTML = '<p class="empty">NOTHING ON THE BOOKS</p>'; return; }

  function row(t, title, where, dayTag) {
    const meta = [dayTag, where].filter(Boolean).join(" \u00B7 ");
    return '<div class="cal-item"><div class="cal-time' + (t === "ALL" ? " is-allday" : "") + '">'
      + esc(t) + '</div><div class="cal-title">' + esc(title)
      + (meta ? '<span class="cal-where">' + esc(meta) + "</span>" : "") + "</div></div>";
  }

  el.innerHTML =
    (today.length
      ? today.map(function (e) { return row(e.time, e.title, e.where); }).join("")
      : '<p class="empty" style="margin:.5rem 0">NOTHING LEFT TODAY</p>')
    + (later.length
      ? '<div class="cal-rule"><span class="cal-rule-label">LATER THIS WEEK</span></div>'
        + later.map(function (e) { return row(e.time, e.title, e.where, e.day); }).join("")
      : "");
}

function parseFeed(xml, fallback) {
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if (doc.querySelector("parsererror")) return [];
  const site = (doc.querySelector("channel > title") || {}).textContent || fallback;
  const initials = site.replace(/[^A-Za-z ]/g, "").trim().split(/\s+/)
    .map(function (w) { return w.charAt(0); }).join("").slice(0, 3).toUpperCase();
  const items = [].slice.call(doc.querySelectorAll("item, entry")).slice(0, 6);
  return items.map(function (it) {
    const dateEl = it.querySelector("pubDate, updated, published");
    const when = new Date(dateEl ? dateEl.textContent : Date.now());
    const mins = Math.max(0, Math.round((Date.now() - when) / 60000));
    const titleEl = it.querySelector("title");
    return {
      src: initials || "RSS",
      when: when,
      title: titleEl ? titleEl.textContent.trim() : "",
      age: mins < 60 ? mins + "m" : mins < 1440 ? Math.round(mins / 60) + "h" : Math.round(mins / 1440) + "d"
    };
  });
}

function renderNews(items) {
  const el = $("newsList");
  if (!items.length) { el.innerHTML = '<p class="empty">NO FEED DATA</p>'; return; }
  el.innerHTML = items.slice(0, 5).map(function (n) {
    return '<div class="news-item"><span class="news-src">' + esc(n.src) + "</span>"
      + '<div class="news-head">' + esc(n.title)
      + '<span class="news-age">' + esc(n.age) + "</span></div></div>";
  }).join("");
}

function renderTicker(bath, cal, failures) {
  const bits = [];
  if (failures.length) bits.push("OFFLINE \u2014 " + failures.join(", ").toUpperCase());
  if (bath) {
    bits.push("BATHROOMREPORT BAKE \u2014 " + (bath.generated
      ? bath.generated.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }).toUpperCase()
      : "?"));
    bits.push("PIPELINE ERRORS \u2014 " + bath.errors);
    if (bath.stale) bits.push("ANALYTICS STALE \u2014 NIGHTLY JOB MISSED A RUN");
  }
  if (cal && cal.generated) {
    bits.push("CALENDAR \u2014 " + new Date(cal.generated)
      .toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).toUpperCase());
  }
  bits.push("BOARD \u2014 REFRESHED " + new Date()
    .toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).toUpperCase());

  $("tickerTag").className = "ticker-tag" + ((failures.length || (bath && bath.errors)) ? " is-bad" : "");
  $("tickerRun").innerHTML = bits.map(function (b) { return "<span>" + esc(b) + "</span>"; }).join("");
}

/* ---------------------------------------------------- clock ---- */
function tick() {
  const d = new Date();
  const h = d.getHours() % 12 || 12;
  $("clock").innerHTML = h + ":" + String(d.getMinutes()).padStart(2, "0")
    + '<span class="mer">' + (d.getHours() >= 12 ? "PM" : "AM") + "</span>";
  $("day").textContent = d.toLocaleDateString("en-US", { weekday: "long" }).toUpperCase();
  $("date").textContent = d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }).toUpperCase();
}

/* ---------------------------------------------------- boot ---- */
async function refresh() {
  const fails = [];
  async function settle(name, p) {
    try { return await p; }
    catch (e) { fails.push(name); console.warn(name, e); return null; }
  }

  const results = await Promise.all([
    settle("weather", grab(WEATHER)),
    settle("dirtcheck", grab(DIRT + "/events.json")),
    settle("dirtcheck", grab(DIRT + "/status.json")),
    settle("analytics", grab(BATH)),
    settle("calendar", grab(CAL))
  ]);
  const wx = results[0], dcEvents = results[1], dcStatus = results[2],
        bathDoc = results[3], calDoc = results[4];

  const feeds = await Promise.all(NEWS.map(function (u, i) {
    return grab(u, "text")
      .then(function (t) { return parseFeed(t, "Feed " + (i + 1)); })
      .catch(function () { return []; });
  }));
  const news = [].concat.apply([], feeds).sort(function (a, b) { return b.when - a.when; });

  if (wx) renderWeather(wx);
  const dirt = (dcEvents && dcStatus) ? dirtRead(dcEvents, dcStatus) : null;
  const bath = bathDoc ? bathRead(bathDoc) : null;

  renderHero(dirt, bath);
  renderProjects(dirt, bath);
  renderCalendar(calDoc);
  renderNews(news);
  renderTicker(bath, calDoc, fails.filter(function (v, i, a) { return a.indexOf(v) === i; }));
}

tick();
setInterval(tick, 10000);
refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
