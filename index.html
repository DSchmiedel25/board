<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------- tokens
   Same vocabulary as the Pixoo: warm dark ground, sodium for "next up",
   flag colours as the only saturated things on screen, one fixed colour per
   track so you find yours before you read it. */
:root{
  /* Taken from DirtCheck so the two never look like different products. */
  --loam:#100f0d;  --panel:#1b1917;  --sunk:#232120;  --rail:#37342f;
  --dust:#f0ebe0;  --slate:#8a8378;  --sodium:#e8b93f;
  --green:#5fbf5a; --red:#d9534a;   --yellow:#e8b93f;
  --gap:20px;
  --r:17px;
}
*{box-sizing:border-box;margin:0;padding:0}

/* The sodium wash of track lights, bleeding down from above the board. */
#app::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(120% 55% at 50% -12%,
    rgba(247,167,44,.16), rgba(247,167,44,.05) 45%, transparent 70%)}
/* Dust hanging in the air between you and the panel. */
#dust{position:absolute;inset:0;pointer-events:none;z-index:60;opacity:.75}
html,body{height:100%;overflow:hidden;background:#000;color:var(--dust)}

/* The board is a single 1920x1080 surface, scaled to whatever is showing it.
   A phone gets the identical layout, just smaller — no separate mobile
   version to keep in sync, and what you check on the way home is exactly
   what's on the wall. */
#stage{position:fixed;inset:0;overflow:hidden}
/* Centred by translate rather than by grid alignment: a grid item wider than
   its container resolves to start, which parks the scaled surface off-screen
   on a phone. */
#app{position:absolute;left:50%;top:50%;width:1920px;height:1080px;
     transform-origin:center center;background:var(--loam)}
body{
  font-family:"Barlow Condensed","Liberation Sans Narrow","Arial Narrow",
              Helvetica,Arial,sans-serif;
  font-size:22px;
  -webkit-font-smoothing:antialiased;
  transition:filter 3s linear;
}
.mono{font-family:"DejaVu Sans Mono",ui-monospace,Menlo,Consolas,monospace}
.eyebrow{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
         font-size:.6em;letter-spacing:.2em;text-transform:uppercase;
         color:var(--slate);font-weight:400}

/* ------------------------------------------------------------ structure */
#app{
  position:relative;z-index:2;
  padding:var(--gap);display:grid;gap:var(--gap);
  /* Now playing is a strip along the bottom rather than a fourth box in the
     left column — stacking four cards there squeezed the track rows into
     each other and clipped the last NASCAR series. */
  /* 12 x 18 uniform cells; every card's position comes from layout.json at
     runtime. Named areas can't express an arbitrary rectangle, which is what
     dragging produces. These are the fallback values used for the one poll
     cycle before layout.json arrives, and if it never does. */
  grid-template-columns:repeat(12,1fr);
  grid-template-rows:repeat(18,1fr);
}
/* With nothing playing, the weather column grows downward rather than the
   race rows stretching across the full width — three items spread over
   1900px reads as a gap, not a list. */
/* The bottom strip stays even with nothing playing — it shows services
   instead — so the grid keeps its fourth row either way. */
/* The bottom strip is always present: what's playing, or service health when
   nothing is. Only the inner card swaps. */
body.no-media #media{display:none}
/* Set by the slot renderer. A module is hidden when its slot is showing a
   different one, or when it isn't in any slot at all. */
#app > [data-hide="1"]{display:none!important}

/* ---------------------------------------------------------------- clock
   Sits over the top-right corner of whatever occupies that area rather than
   claiming cells of its own. Tabular figures so the colon doesn't jitter. */
#cornerclock{position:absolute;top:calc(var(--gap) + 8px);right:calc(var(--gap) + 18px);
       z-index:40;text-align:right;pointer-events:none;
       text-shadow:0 2px 10px rgba(0,0,0,.75)}
#cornerclock .t{display:block;font-size:60px;font-weight:900;line-height:.9;
        letter-spacing:.01em;font-variant-numeric:tabular-nums}
#cornerclock .d{display:block;font-family:"DejaVu Sans Mono",ui-monospace,monospace;
        font-size:15px;letter-spacing:.2em;color:var(--sodium);
        text-transform:uppercase;margin-top:5px}
/* Set by applyLayout when "clock" holds a slot somewhere. */
#app[data-clockslot="1"] #cornerclock{display:none}

/* The clock module. No header — a card that says CLOCK above a clock is
   wasting the cells that make it legible from the doorway. Tabular figures
   again, and the minute pinned to the baseline of the hour. */
#clock .body{align-items:center;justify-content:center;text-align:center;
             gap:calc(var(--gap)*.35)}
#clock .ct{display:flex;align-items:baseline;justify-content:center;gap:.1em;
           font-size:clamp(26px,calc(48 * var(--u)),263px);font-weight:900;line-height:.84;
           letter-spacing:.005em;font-variant-numeric:tabular-nums}
#clock .cm{font-size:.3em;font-weight:800;letter-spacing:.12em;
           color:var(--accent, var(--sodium))}
#clock .cd{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
           font-size:clamp(7px,calc(10 * var(--u)),55px);letter-spacing:.22em;
           color:var(--accent, var(--sodium));text-transform:uppercase;line-height:1.2}
/* Seconds as a sweep rather than digits: readable at a glance from across the
   room, where two more numerals would not be. */
#clock .csec{display:none;width:62%;height:max(2px,calc(1.4 * var(--u)));border-radius:99px;
             background:rgba(255,255,255,.13);overflow:hidden}
#clock[data-secs="on"] .csec{display:block}
#clock .csec i{display:block;height:100%;width:0;border-radius:99px;
               background:var(--accent, var(--sodium));transition:width .28s linear}
/* A fresh minute snaps back instead of sliding the whole way in reverse. */
#clock[data-wrap="1"] .csec i{transition:none}
#clock[data-date="off"] .cd{display:none}

/* Small slots: the sweep goes first, then the AM/PM marker, then the date —
   the time itself is the last thing to give up room. */
@container (max-height: 150px){
  #clock[data-secs="on"] .csec{display:none}
}
@container (max-height: 110px){
  #clock .cm{font-size:.26em;letter-spacing:.06em}
}
@container (max-width: 200px){
  #clock .cd{display:none}
}

/* ---------------------------------------------------------- scale unit
   --u is one "size unit" for a card: the average of 1% of its height and 1%
   of its width, normalised so that at each card's default slot size one unit
   equals exactly what 1cqh used to. Everything inside a card is a multiple of
   it, so content tracks the slot in both directions.

   Averaging the two axes rather than using height alone fixes the case that
   made cards look broken when resized: a tall narrow slot has a large cqh and
   a small cqi, so height-only scaling grew the type at exactly the moment the
   room for it was shrinking. Averaging means growing a card in one direction
   grows its contents by roughly half as much, which is what looks right.

   Custom properties are substituted, not resolved, where they're declared —
   the cq units here resolve in the descendant that uses them, where the
   nearest container is this card. Using --u on the card itself would resolve
   against the card's own ancestor instead, which is why nothing does. */
/* var(--textScale,1): set per-module from L.opts[key].scale by applyLayout,
   defaulting to 1 (untouched) for anything never explicitly adjusted. This
   multiplies on top of the automatic cqh/cqi sizing rather than replacing
   it — the formula still does the real work of matching type to a card's
   actual rendered size; this is the manual correction on top of it for
   whichever specific module still doesn't look right at a specific size. */
#flag{--u:calc(var(--textScale,1) * (1cqh + 0.0833cqi)/2)}
#racing{--u:calc(var(--textScale,1) * (1cqh + 0.5227cqi)/2)}
#gallery{--u:calc(var(--textScale,1) * (1cqh + 0.5227cqi)/2)}
#weather{--u:calc(var(--textScale,1) * (1cqh + 0.4320cqi)/2)}
#radar{--u:calc(var(--textScale,1) * (1cqh + 0.2793cqi)/2)}
#wire{--u:calc(var(--textScale,1) * (1cqh + 0.0520cqi)/2)}
#media{--u:calc(var(--textScale,1) * (1cqh + 0.0833cqi)/2)}
#services{--u:calc(var(--textScale,1) * (1cqh + 0.0833cqi)/2)}
#pihole{--u:calc(var(--textScale,1) * (1cqh + 0.0833cqi)/2)}
#system{--u:calc(var(--textScale,1) * (1cqh + 0.1685cqi)/2)}
#net{--u:calc(var(--textScale,1) * (1cqh + 0.1685cqi)/2)}
#clock{--u:calc(var(--textScale,1) * (1cqh + 0.3443cqi)/2)}

/* ------------------------------------------------------- health cards
   Pi health and Network are the same shape because they answer the same kind
   of question: a word, then the reason, then the numbers behind it. Reading
   order is deliberate — from the doorway you get the word, from the sofa the
   reason, and you only walk over for the numbers. */
#system .body, #net .body{gap:calc(var(--gap)*.45 * var(--rowGap,1))}
.hhead{display:flex;align-items:baseline;gap:.5em}
.hdot{width:.62em;height:.62em;border-radius:50%;flex:0 0 auto;
      background:var(--slate);align-self:center}
.hword{font-size:clamp(12px,calc(17 * var(--u)),93px);font-weight:900;letter-spacing:.04em;
       text-transform:uppercase;line-height:1}
.hnote{font-size:clamp(8px,calc(11 * var(--u)),60px);font-weight:600;color:var(--dust);
       opacity:.85;line-height:1.15;
       display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
       overflow:hidden}
.hnote:empty{display:none}
/* auto-fit rather than a fixed count: the same card is legible at 4 cells
   wide with two readings and at 12 with six, without a breakpoint each. */
.hstats{display:grid;gap:.35em calc(var(--gap)*.6);margin-top:auto;
        grid-template-columns:repeat(auto-fit,minmax(clamp(66px,calc(118.7 * var(--u)),132px),1fr))}
.hstat{min-width:0}
.hstat b{display:block;font-size:clamp(11px,calc(15 * var(--u)),82px);font-weight:900;
         line-height:1.02;font-variant-numeric:tabular-nums;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstat span{display:block;font-family:"DejaVu Sans Mono",ui-monospace,monospace;
            font-size:clamp(6px,calc(6.5 * var(--u)),36px);letter-spacing:.14em;
            color:var(--slate);text-transform:uppercase;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* A bar under the reading for anything with a ceiling — fullness and load
   read faster as a length than as a percentage. */
.hbar{height:max(2px,calc(1.1 * var(--u)));border-radius:99px;margin-top:.28em;
      background:rgba(255,255,255,.12);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:99px;background:var(--accent, var(--sodium))}
.hstat.warn b{color:var(--yellow)}
.hstat.warn .hbar i{background:var(--yellow)}
.hstat.bad b{color:var(--red)}
.hstat.bad .hbar i{background:var(--red)}

#system[data-level="ok"] .hdot, #net[data-level="ok"] .hdot{background:var(--green)}
#system[data-level="warn"] .hdot, #net[data-level="warn"] .hdot{background:var(--yellow)}
#system[data-level="bad"] .hdot, #net[data-level="bad"] .hdot{background:var(--red)}
#system[data-level="bad"] .hword, #net[data-level="bad"] .hword{color:var(--red)}
#system[data-level="warn"] .hword, #net[data-level="warn"] .hword{color:var(--yellow)}
/* Only the bad state moves. A pulsing warn would make a warm afternoon look
   like an emergency for six months of the year. */
#system[data-level="bad"] .hdot, #net[data-level="bad"] .hdot{animation:hpulse 1.9s ease-in-out infinite}
@keyframes hpulse{50%{opacity:.35}}

/* Short slots shed the numbers before the verdict: a two-row strip should
   still say GATEWAY UNREACHABLE even with no room for a latency figure. */
@container (max-height: 150px){
  #system .hstat .hbar, #net .hstat .hbar{display:none}
}
@container (max-height: 104px){
  #system .hnote, #net .hnote{-webkit-line-clamp:1}
}
@container (max-height: 76px){
  #system .hstats, #net .hstats{display:none}
}

/* --------------------------------------------------------------- stale
   The page can tell when board.py has stopped writing. It could not tell
   when the Pi itself had gone, because a dead Pi serves nothing and the
   browser simply keeps the last render on screen forever. Both cases now
   land here. */
#stale{position:absolute;left:0;right:0;top:0;z-index:70;
       background:var(--red);color:#2a0b0a;font-weight:800;font-size:26px;
       letter-spacing:.06em;text-transform:uppercase;text-align:center;
       padding:.5em 1em}
#stale[hidden]{display:none}
/* Every card is a query container, so its contents can size themselves
   against the card rather than against the page. The old stylesheet was a
   list of absolute pixel values tuned for one fixed arrangement; the moment
   a card could be resized they were all wrong — a 168px temperature clips
   the instant its card gets shorter, and seven service rows overflow a strip
   that used to be tall enough.

   cqh is 1% of the container's height, cqi 1% of its inline size. Type in
   these units tracks the box it lives in. Chromium 105+ supports them; Pi OS
   Bookworm ships well past that. */
.card{background:var(--panel);border-radius:var(--r);overflow:hidden;
      display:flex;flex-direction:column;min-height:0;
      container-type:size}
.card > header{padding:.7em 1.1em;display:flex;align-items:baseline;gap:1em;
               background:var(--sunk)}
.card > header h2{font-size:1.7em;letter-spacing:.06em;font-weight:900;
                  text-transform:uppercase}
.card > header .right{margin-left:auto}
.body{padding:var(--gap);display:flex;flex-direction:column;
      gap:calc(var(--gap)*.7);flex:1;min-height:0}

/* ---------------------------------------------------------- signature
   The flag strip is the whole point: one field, full width, that answers
   "is racing happening" from the doorway. Everything else is subordinate.
   On a green night it moves. */
#flag{grid-column:1/span 12;grid-row:1/span 3;border-radius:var(--r);position:relative;overflow:hidden;
      container-type:size;
      display:flex;align-items:center;gap:1.2em;
      padding:1em 1.2em;background:var(--sunk)}
/* clamp so it neither vanishes in a short strip nor overruns a tall one. */
#flag .word{font-size:clamp(30px,calc(61 * var(--u)),334px);font-weight:900;line-height:.92;
            letter-spacing:.02em;text-transform:uppercase;position:relative}
#flag .sub{font-size:clamp(13px,calc(20 * var(--u)),110px);font-weight:700;opacity:.8;
           margin-left:auto;text-align:right;line-height:1.2;color:inherit;
           text-transform:uppercase;letter-spacing:.14em}
#flag.racing{background:var(--green);color:#08240f}
#flag.rained{background:var(--red);color:#2a0b0a}
#flag.watch{background:var(--yellow);color:#2b2205}
#flag.standby{background:var(--sunk);color:var(--accent, var(--sodium))}
#flag.racing{color:#08210b}
#flag.offline{background:var(--rail);color:var(--dust)}
/* Two explicit flanks rather than a masked overlay — CSS mask sizing on a
   repeating conic-gradient proved unreliable, and this is easier to reason
   about anyway. */
#flag .checks{position:absolute;top:0;bottom:0;width:clamp(60px,9%,150px);
  opacity:0;pointer-events:none;
  background:conic-gradient(#fff 25%,#0000 0 50%,#fff 0 75%,#0000 0) 0 0/24px 24px;
  mix-blend-mode:soft-light}
#flag .checks.l{left:0}
#flag .checks.r{right:0}
#flag.racing .checks{opacity:.55;animation:march 2.2s linear infinite}
#flag .sheen{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.32) 50%,
             transparent 62%);transform:translateX(-100%)}
#flag.racing .sheen,#flag.rained .sheen,#flag.watch .sheen{
  opacity:1;animation:sweep 5.5s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-100%)}
                 55%,100%{transform:translateX(100%)}}
@keyframes march{to{background-position:48px 0}}

/* ------------------------------------------------------------- tracks */
#racing{grid-column:1/span 7;grid-row:4/span 10}
#racing .body{gap:0;justify-content:space-between;overflow:hidden}
/* Six rows in one card, so the two halves need telling apart without a
   second header eating a row's worth of height. A hairline and a small
   caption in the gutter does it. */
.rgroup{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
        font-size:clamp(6px,calc(2.3 * var(--u)),46px);
        letter-spacing:.2em;color:var(--slate);text-transform:uppercase;
        padding:.25em 0 .35em;display:flex;align-items:center;gap:.8em}
.rgroup:before{content:"";flex:1;height:1px;background:var(--rail);order:2}
.rrow{display:flex;align-items:center;gap:1em;padding:calc(.32em * var(--rowGap,1)) 0;min-width:0}
.rrow .bar{width:clamp(3px,calc(0.88 * var(--u)),9px);align-self:stretch;border-radius:99px;flex:none;
           background:var(--rail)}
.rrow.live .bar{background:var(--green)}
.rrow .who{flex:1;min-width:0}
/* Six rows plus two captions share this card, so a row is about 1/7th of
   it. Sized against that rather than a fixed 27px. */
.rrow .nm{font-size:clamp(12px,calc(4.7 * var(--u)),94px);font-weight:700;letter-spacing:.04em;
          line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .sub{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
           font-size:clamp(6px,calc(2.5 * var(--u)),50px);
           letter-spacing:.13em;color:var(--accent, var(--sodium));text-transform:uppercase;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .when{text-align:right;flex:none}
.rrow .w1{font-size:clamp(11px,calc(4.2 * var(--u)),84px);font-weight:700;line-height:1.1}
/* Was 2.29 * --u in a low-contrast tan (#c9bda9) — half the size of the day
   label above it and dim enough to disappear from across a room, even
   though DARK/GREEN is the actual answer to "is this track racing tonight".
   Brought up near .sub's weight (2.5 * --u, --sodium) so it reads as
   confidently as the day it's paired with. */
.rrow .w2{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
          font-size:clamp(9px,calc(3.1 * var(--u)),58px);font-weight:700;
          letter-spacing:.12em;color:var(--dust);text-transform:uppercase}
.rrow.dark .w2{color:#c9bda9}
.rrow.live .w2{color:var(--green)}
.rrow.live .w1{color:var(--green);font-weight:800}
.rrow.dark .nm{color:#a49b8d}
.rrow .net{background:var(--sunk);color:var(--accent, var(--sodium));font-weight:800;
           border-radius:.4em;padding:.18em .5em;font-size:clamp(8px,calc(2.99 * var(--u)),60px);flex:none;
           min-width:3.2em;text-align:center}
/* Fixed columns rather than `1fr` pushing the times to the far edge — across
   a 1000px panel that opens a canyon between the name and the status. */
#weather{grid-column:8/span 5;grid-row:4/span 6;position:relative;background:#1d3a63}
#weather .body{position:relative;z-index:2}
/* Alert band. Sits between the header and the forecast, present only when
   something is actually active — which is most of the time, nothing. Colour
   tracks NWS severity rather than a single alarm red, because a Frost
   Advisory and a Tornado Warning arriving in the same widget need to look
   different from across a room. */
#wxAlert{position:relative;z-index:3;padding:.5em 1.1em;display:flex;
         align-items:baseline;gap:.9em;background:var(--sodium);color:#2b2205}
#wxAlert[hidden]{display:none}
#wxAlert .ev{font-size:clamp(14px,calc(9.3 * var(--u)),108px);font-weight:900;letter-spacing:.01em;
             text-transform:uppercase;line-height:1.05;white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis}
#wxAlert .til{margin-left:auto;font-family:"DejaVu Sans Mono",ui-monospace,monospace;
              font-size:15px;letter-spacing:.12em;text-transform:uppercase;
              white-space:nowrap;opacity:.85}
#wxAlert .more{font-family:"DejaVu Sans Mono",ui-monospace,monospace;font-size:15px;
               font-weight:800;background:rgba(0,0,0,.22);border-radius:.4em;
               padding:.1em .45em;flex:none}
#wxAlert.severe{background:#d9534a;color:#2a0b0a}
#wxAlert.extreme{background:#a3231a;color:#fff}
/* Extreme is the one case where movement is warranted: it is rare enough
   that it will not become wallpaper. */
#wxAlert.extreme{animation:apulse 2.4s ease-in-out infinite}
@keyframes apulse{50%{background:#c22a1f}}
#wxAlert.stale{background:var(--rail);color:var(--dust)}
#sky{position:absolute;inset:0;z-index:0;width:100%;height:100%}
#weather header{background:rgba(0,0,0,.28);position:relative;z-index:2}
.wxmain{display:flex;align-items:center;gap:.4em;flex:1}
/* Was 168px flat, which is why it clipped the moment the weather card was
   split in half to make room for the radar. */
.wxtemp{font-size:clamp(44px,calc(50 * var(--u)),583px);font-weight:900;line-height:.8;
        letter-spacing:-.02em}
.tempwrap{display:flex;align-items:baseline;gap:.08em}
.wxdeg{font-size:clamp(16px,calc(13 * var(--u)),152px);font-weight:700;opacity:.7}
.wxsub{margin-left:auto;text-align:right;font-size:.86em;line-height:1.7;color:#dbe6f7}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(.6em * var(--rowGap,1));margin-top:auto;
      border-top:1px solid rgba(255,255,255,.28);padding-top:.7em}
.day{text-align:center}
.day .n{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
        font-size:.68em;color:#c3d4ec;letter-spacing:.18em}
.day .hi{font-size:clamp(16px,calc(12.5 * var(--u)),146px);font-weight:800;line-height:1.15}
.day .lo{font-size:.86em;color:#b3c6e2}

/* -------------------------------------------------------------- radar
   Fixed tiles rather than a mapping library: a wall panel never pans or
   zooms, so there is nothing for Leaflet to do, and one fewer CDN to be
   offline when the internet is. */
#radar{grid-column:8/span 5;grid-row:10/span 4;position:relative;
       overflow:hidden;background:#0b1522}
#radar > header{display:none}
/* The tile maths reads this box's pixel size, so it has to fill the card
   rather than sit in the flex flow the way it did inside the weather panel. */
.rbox{position:absolute;inset:0;overflow:hidden}
#radar .tiles{position:absolute;top:0;left:0;width:100%;height:100%;
              transform-origin:0 0}
#radar .pins{position:absolute;inset:0}
#radar .tiles img{position:absolute;image-rendering:auto}
/* CARTO's dark basemap measures ~12/255 mean brightness on its own — dimming
   it further left a black rectangle. It gets lifted instead, and the radar
   still reads clearly on top because the echoes are saturated colour against
   a desaturated map. */
#radarBase img{filter:brightness(2.6) contrast(1.08) saturate(.45)}
#radarEcho img{opacity:0;transition:opacity .18s linear;mix-blend-mode:screen}
#radarEcho img.on{opacity:.92}
#radar .pin{position:absolute;transform:translate(-50%,-50%);
            width:clamp(7px,calc(5.1 * var(--u)),20px);height:clamp(7px,calc(5.1 * var(--u)),20px);
            border-radius:50%;
            box-shadow:0 0 0 2px rgba(0,0,0,.65)}
/* left/top in em so the label stays pinned to the dot at any size. */
#radar .pin b{position:absolute;left:1em;top:-.33em;
              font-size:clamp(7px,calc(6.96 * var(--u)),53px);
              font-weight:800;letter-spacing:.06em;white-space:nowrap;
              text-shadow:0 1px 3px #000,0 0 8px #000}
#radar .radarfoot{position:absolute;left:0;right:0;bottom:0;display:flex;
  gap:1em;padding:.35em .8em;background:linear-gradient(transparent,#000a 55%)}
#radar .credit{margin-left:auto;opacity:.5;text-decoration:none;
               color:inherit}

/* ------------------------------------------------- progressive detail
   Scaling type stops things clipping, but a card can get short enough that
   the right answer is to show less, not smaller. These are the drop rules,
   in the order the information is least missed. Each card queries its own
   size, so the same module behaves correctly in a tall slot and a strip.

   The screenshot that prompted this had seven service rows sliced off top
   and bottom, town names cut mid-word, and a temperature with its lower half
   missing. All three are this. */

/* Weather: the three-day forecast is the first thing to go, then the
   secondary readings, leaving the number and the condition. */
@container (max-height: 260px){
  #weather .days{display:none}
}
@container (max-height: 170px){
  #weather .wxsub{display:none}
  #weather > header{padding:.35em 1.1em}
}

/* Services: rows wrap, and a wrapped row that doesn't fit was being clipped
   rather than dropped. Cap the count by height and say how many are hidden. */
@container (max-height: 150px){
  .svc:nth-child(n+7){display:none}
}
@container (max-height: 110px){
  .svc:nth-child(n+5){display:none}
  .spct{display:none}
}
@container (max-height: 80px){
  .svc:nth-child(n+4){display:none}
}

/* Racing: the town under each track name, then the network badge. The names
   and times survive to the smallest useful size. */
@container (max-height: 300px){
  .rrow .sub{display:none}
  .rrow{padding:.18em 0}
}
@container (max-height: 210px){
  .rrow .net{display:none}
  /* Lower the ceiling rather than pinning a pixel size: a fixed value here
     means the caption stops shrinking as the card keeps shrinking, which is
     the whole complaint about cards that ignore their slot. */
}

/* Wire: fewer headlines rather than three squeezed ones. */
@container (max-height: 120px){
  .wrow:nth-child(n+3){display:none}
}
@container (max-height: 78px){
  .wrow:nth-child(n+2){display:none}
  .wmark{display:none}
}

/* Pi-hole: sparkline, then the top domain, then the raw counts. The
   percentage is the whole point and never goes. */
@container (max-width: 700px){
  .phspark{display:none}
}
@container (max-width: 520px){
  .phtop{display:none}
}
@container (max-width: 380px){
  .phnums{display:none}
}

/* Radar: the credit line and the timestamp crowd a small map. */
@container (max-height: 190px){
  #radar .radarfoot{padding:.2em .5em}
  #radar .credit{display:none}
}


/* Now playing: side-by-side streams need width; below it they stack, and
   below that only the first is shown. */
@container (max-width: 900px){
  #media .streams{flex-direction:column;gap:.3em}
}

/* ------------------------------------------------------------- nascar */
/* --------------------------------------------------------------- wire
   Three headlines, fixed slots, swapped on a timer. A scrolling ticker is
   the obvious move and the wrong one: anything in constant motion at the
   edge of vision pulls your eye off whatever you were actually reading.
   Sized in cqh so the rows fill whatever height the slot has rather than
   floating in it with dead gaps. */
#wire{grid-column:1/span 12;grid-row:14/span 2}
#wire > header{display:none}
#wire .body{flex-direction:row;align-items:stretch;gap:calc(var(--gap) * var(--rowGap,1));
            padding:calc(2 * var(--u)) var(--gap)}
.wmark{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
       font-size:clamp(7px,calc(15.3 * var(--u)),52px);
       letter-spacing:.18em;text-transform:uppercase;color:var(--slate);
       flex:none;padding-right:var(--gap);border-right:1px solid var(--rail);
       display:flex;flex-direction:column;justify-content:center;gap:.35em}
.wmark .wage{color:var(--accent, var(--sodium))}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column;
      justify-content:space-around;overflow:hidden}
.wrow{display:flex;align-items:baseline;gap:1em;min-width:0;
      transition:opacity .55s ease}
.wrow.out{opacity:0}
.wsrc{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
      font-size:clamp(8px,calc(14.3 * var(--u)),16px);
      letter-spacing:.14em;color:var(--accent, var(--sodium));flex:0 0 74px;
      text-align:right;text-transform:uppercase}
/* One line, always. A headline that wraps to two pushes the row below it off
   the card, and the layout has no room to absorb that. */
.wtitle{font-size:clamp(13px,calc(29.7 * var(--u)),102px);font-weight:700;letter-spacing:.02em;
        flex:1;min-width:0;white-space:nowrap;overflow:hidden;
        text-overflow:ellipsis;line-height:1.12}
.wtime{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
       font-size:clamp(8px,calc(14.3 * var(--u)),16px);color:var(--slate);flex:none}
.wnone{color:var(--slate);font-size:clamp(9px,calc(20.45 * var(--u)),70px);align-self:center}
/* Marquee: rows laid end to end on one line and translated. The set is
   duplicated so the loop is seamless. */
#wire[data-mode="marquee"] .wrap{flex-direction:row;flex-wrap:nowrap;
  overflow:hidden;align-items:center;
  -webkit-mask-image:linear-gradient(90deg,#0000,#000 3%,#000 97%,#0000);
          mask-image:linear-gradient(90deg,#0000,#000 3%,#000 97%,#0000)}
#wire[data-mode="marquee"] .wrow{flex:0 0 auto;padding-right:3em;
  animation:wmarch linear infinite;opacity:1}
#wire[data-mode="marquee"] .wtitle{white-space:nowrap;overflow:visible;flex:0 0 auto}
@keyframes wmarch{to{transform:translateX(-100%)}}

/* -------------------------------------------------------------- gallery
   Two stacked layers so one item can fade into the next without either
   flickering through the background. Each layer holds its own blurred
   backdrop, because the fill has to travel with the image it belongs to. */
#gallery{grid-column:1/span 6;grid-row:4/span 11;position:relative;
         overflow:hidden;background:#080706}
#gallery > header{display:none}
#gallery .body{padding:0;position:relative}
.gl{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.gl.on{opacity:1}
.gl .back{position:absolute;inset:0;background-size:cover;background-position:center;
          filter:blur(60px) saturate(1.8) brightness(.5);transform:scale(1.35)}
.gl img,.gl video{position:absolute;inset:0;width:100%;height:100%;
                  object-fit:contain;z-index:1}
#gallery[data-fit="cover"] .gl img,#gallery[data-fit="cover"] .gl video{
  object-fit:cover}
/* The blurred fill only earns its place behind a letterboxed image; behind a
   cropped one it is invisible and still costs a blur pass every frame. */
#gallery[data-fit="cover"] .gl .back,.gl[data-fit="cover"] .back{display:none}
.glnone{position:absolute;inset:0;display:flex;align-items:center;
        justify-content:center;color:var(--slate);font-size:clamp(12px,calc(4.57 * var(--u)),91px);
        text-align:center;padding:2em}

/* -------------------------------------------------------------- media */
/* Services share the media slot; only one is ever visible. */
#services{grid-column:1/span 12;grid-row:16/span 3;position:relative;overflow:hidden}
/* .card sets display:flex, which outranks the hidden attribute's default */
#services[hidden]{display:none}
#services .body{flex-direction:row;align-items:center;gap:calc(var(--gap) * var(--rowGap,1))}
.shead{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
       font-size:clamp(7px,calc(9.57 * var(--u)),52px);
       letter-spacing:.18em;text-transform:uppercase;flex:none;
       padding-right:var(--gap);border-right:1px solid var(--rail)}
.shead.ok{color:var(--green)} .shead.bad{color:var(--red)}
/* Overflow hidden so a row that does not fit is cut cleanly at the card
   edge instead of spilling over the one below it. The container rules above
   are what actually keep the count sane; this is the backstop. */
.svcs{display:flex;align-items:center;gap:calc(var(--gap)*1.4);flex:1;
      min-width:0;flex-wrap:wrap;overflow:hidden;align-content:center}
.svc{display:flex;align-items:baseline;gap:clamp(5px,calc(5.74 * var(--u)),16px);min-width:0}
.sdot{width:clamp(6px,calc(6.38 * var(--u)),17px);height:clamp(6px,calc(6.38 * var(--u)),17px);
      border-radius:50%;flex:none;background:var(--green)}
.svc.dn .sdot{background:var(--red)}
.sname{font-size:clamp(11px,calc(15.3 * var(--u)),84px);font-weight:700;letter-spacing:.03em;
       white-space:nowrap}
.svc.dn .sname{color:var(--dust)} .svc.up .sname{color:#bdb1a2}
.spct{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
      font-size:clamp(6px,calc(8.94 * var(--u)),49px);
      color:var(--slate)}
.svcnone{color:var(--slate);font-size:clamp(9px,calc(12.77 * var(--u)),70px)}

/* -------------------------------------------------------------- pihole
   Built to sit in the same slot as Services and rotate with it, so it is
   laid out as a strip: one big number, the counts, and a sparkline. */
#pihole{grid-column:1/span 12;grid-row:16/span 3;position:relative;overflow:hidden}
#pihole > header{display:none}
#pihole .body{flex-direction:row;align-items:center;gap:calc(var(--gap) * var(--rowGap,1));
              padding:clamp(6px,calc(7.66 * var(--u)),20px) var(--gap)}
.phpct{font-size:clamp(24px,calc(40.9 * var(--u)),224px);font-weight:900;line-height:.85;letter-spacing:-.01em;
       font-variant-numeric:tabular-nums;flex:none}
/* em, not cqh: this hangs off .phpct and should track it exactly. */
.phpct small{font-size:.41em;font-weight:700;opacity:.65;margin-left:.06em}
.phlab{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
       font-size:clamp(6px,calc(8.3 * var(--u)),46px);
       letter-spacing:.18em;text-transform:uppercase;color:var(--slate);
       flex:none;padding-right:var(--gap);border-right:1px solid var(--rail);
       align-self:stretch;display:flex;flex-direction:column;
       justify-content:center;gap:.35em}
.phnums{display:flex;gap:calc(var(--gap)*1.3);flex:none}
.phn .v{font-size:clamp(12px,calc(17.2 * var(--u)),94px);font-weight:800;
        font-variant-numeric:tabular-nums;line-height:1.05}
.phn .k{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
        font-size:clamp(6px,calc(7.98 * var(--u)),44px);
        letter-spacing:.15em;color:var(--slate);text-transform:uppercase}
.phtop{flex:1;min-width:0}
.phtop .d{font-size:clamp(9px,calc(12.77 * var(--u)),70px);font-weight:700;
          white-space:nowrap;overflow:hidden;
          text-overflow:ellipsis;color:#cdc2b2}
/* Sparkline as flexed bars rather than a canvas: 24 divs cost nothing and
   need no redraw loop on a Pi that already runs two. */
/* Height off cqh, width off cqi: the sparkline should get taller in a tall
   slot and longer in a wide one, not take both from one axis. */
.phspark{display:flex;align-items:flex-end;gap:clamp(1px,calc(1.28 * var(--u)),4px);
         height:clamp(20px,calc(28.09 * var(--u)),74px);flex:none;
         width:clamp(90px,calc(121.4 * var(--u)),320px)}
.phspark i{flex:1;background:var(--rail);border-radius:1px;min-height:2px}
.phspark i b{display:block;width:100%;background:var(--accent, var(--sodium));border-radius:1px}
#pihole.off .phpct{color:var(--slate)}
.phpause{color:var(--red);font-weight:800}
.phstale{color:var(--accent, var(--sodium))}

#media{grid-column:1/span 12;grid-row:16/span 3;position:relative;overflow:hidden}
/* No card header on the strip: at 152px tall it would eat half the space,
   so the label rides inline with the title instead. */
#media > header{display:none}

/* The panel takes the colour of whatever is on — the same trick the LIFX
   bulb plays, so the room and the board agree. Heavy blur keeps it as light
   rather than a picture competing with the one beside it. */
#media .backdrop{position:absolute;inset:0;z-index:0;
  background-size:cover;background-position:center;
  filter:blur(52px) saturate(2.1) brightness(1.15);
  transform:scale(1.4);opacity:.85;
  transition:background-image .6s ease}
#media .scrim{position:absolute;inset:0;z-index:1;
  background:linear-gradient(100deg,rgba(18,14,11,.18) 0 18%,
             rgba(18,14,11,.62) 52%,rgba(18,14,11,.86) 100%)}
#media > header,#media .body{position:relative;z-index:2}
#media > header{background:rgba(18,14,11,.42);backdrop-filter:blur(8px)}
#media .body{flex-direction:row;gap:calc(var(--gap)*1.3);align-items:center;
             padding:clamp(7px,calc(8.94 * var(--u)),24px) var(--gap)}
#poster{height:100%;aspect-ratio:2/3;border-radius:calc(var(--r)*.6);
        object-fit:cover;background:var(--sunk);flex:none;
        box-shadow:0 12px 30px -8px rgba(0,0,0,.75),
                   0 0 0 1px rgba(255,255,255,.09);
        animation:poster .7s cubic-bezier(.2,.7,.3,1) both}
@keyframes poster{from{opacity:0;transform:translateY(10px) scale(.97)}}
#poster[data-empty]{display:none}
/* Explicit rows: with implicit ones the title and the progress bar landed
   in the same track and overlapped. */
.meta{display:grid;grid-template-columns:auto 1fr auto;
      grid-template-rows:auto auto auto;align-items:center;
      gap:clamp(2px,calc(2.55 * var(--u)),8px) 1.4em;min-width:0;flex:1;align-content:center}
.meta .title{grid-row:1;grid-column:1;font-size:clamp(15px,calc(21.7 * var(--u)),119px);
             font-weight:700;line-height:1.05;
             text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;
             /* cqi, not vw: #app is a fixed 1920px stage that gets transform-scaled, so
   vw measures the browser window rather than the card, and the cap lands in
   the wrong place on any screen that is not exactly 1080p. */
             overflow:hidden;text-overflow:ellipsis;max-width:calc(416.6 * var(--u))}
.meta .ep{grid-row:1;grid-column:2;color:#cbb9a6;font-size:.95em;letter-spacing:.02em;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .who{grid-row:1;grid-column:3;color:var(--accent, var(--sodium));font-weight:700;
           letter-spacing:.06em;white-space:nowrap}
.prog{grid-row:2;grid-column:1/4;height:clamp(4px,calc(5.11 * var(--u)),14px);
      border-radius:99px;background:var(--rail);
      margin-top:clamp(3px,calc(3.83 * var(--u)),10px)}
.prog i{display:block;height:100%;border-radius:.25em;background:var(--accent, var(--sodium))}
.left{grid-row:3;grid-column:1/4;font-size:.78em;color:var(--slate);margin-top:3px}

/* The strip is wide and short, so several watchers sit side by side as equal
   cells rather than one hero with the rest crammed into a sidebar. */
.streams{display:flex;align-items:stretch;gap:calc(var(--gap) * var(--rowGap,1));flex:1;min-width:0}
/* stretch, not center: with centred children the row height is indefinite,
   so the poster's height:100% fell back to its natural 600px and swallowed
   half the strip. */
.stream{display:flex;align-items:stretch;gap:clamp(8px,calc(10.21 * var(--u)),28px);flex:1;min-width:0}
.stream + .stream{border-left:1px solid rgba(255,255,255,.16);
                  padding-left:var(--gap)}
/* Sized by width, not height: a percentage height against an indefinite row
   resolves to the image's natural 600px, which ate half the strip. */
.stream .art{width:clamp(38px,calc(52.34 * var(--u)),140px);height:auto;aspect-ratio:2/3;
             border-radius:9px;
             object-fit:cover;background:var(--sunk);flex:0 0 auto;
             align-self:center;
             box-shadow:0 10px 24px -8px rgba(0,0,0,.7),
                        0 0 0 1px rgba(255,255,255,.08)}
.stream .art[data-empty]{display:none}
.sinfo{display:flex;flex-direction:column;justify-content:center;
       gap:clamp(2px,calc(1.91 * var(--u)),6px);
       min-width:0;flex:1}
.stitle{font-size:clamp(13px,calc(19.15 * var(--u)),105px);font-weight:700;
        text-transform:uppercase;line-height:1.05;
        letter-spacing:.01em;white-space:nowrap;overflow:hidden;
        text-overflow:ellipsis}
.ssub{font-size:clamp(7px,calc(10.21 * var(--u)),56px);color:#cbb9a6;
      white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis}
.swho{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
      font-size:clamp(6px,calc(8.94 * var(--u)),49px);
      letter-spacing:.16em;color:var(--accent, var(--sodium))}
.stream .prog{margin-top:clamp(2px,calc(3.19 * var(--u)),9px);height:clamp(3px,calc(4.47 * var(--u)),12px)}
#media[data-n="2"] .stitle{font-size:clamp(12px,calc(16.6 * var(--u)),91px)}
#media[data-n="3"] .stitle{font-size:clamp(9px,calc(13.4 * var(--u)),73px)}
#media[data-n="3"] .ssub{font-size:clamp(6px,calc(8.94 * var(--u)),49px)}

/* ---------------------------------------------------------- media: hero
   The strip above was built for a wide short bar and can't make the poster
   the point no matter how tall its slot gets — 2/3 of a 3-row strip is
   still a thumbnail. This is the other mode: one viewer, in a slot roomy
   enough to be a poster rather than a bar. renderMedia measures the card's
   own rendered box and rebuilds #mediaBody as one markup or the other each
   poll — only one is ever in the DOM, so these rules are just the shared
   geometry for whichever one that is. */
#media .hero{position:absolute;inset:0;display:flex;flex-direction:column}
/* No entrance animation here, unlike the dead #poster rule this was modelled
   on: renderMedia rebuilds this markup on every 15s poll regardless of
   whether anything changed, so an animation would replay the whole time a
   movie is playing rather than once when it starts. */
#media .heroArt{position:absolute;inset:0;width:100%;height:100%;
                object-fit:cover;object-position:center 22%}
#media .heroArt[data-empty]{display:none}
/* Solid at the very bottom rather than fading to transparent — the progress
   bar needs a floor it can sit on that reads at any poster's brightness,
   not just the dark ones the scrim happens to suit. */
#media .heroScrim{position:absolute;inset:0;z-index:1;
  background:linear-gradient(to bottom,transparent 38%,
              rgba(14,11,9,.55) 62%,rgba(14,11,9,.94) 88%,rgba(14,11,9,.98) 100%)}
#media .heroInfo{position:relative;z-index:2;margin-top:auto;
                 padding:var(--gap) calc(var(--gap)*1.2)}
#media .hwho{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
            font-size:clamp(9px,calc(6.5 * var(--u)),56px);font-weight:800;
            letter-spacing:.16em;color:var(--accent, var(--sodium));text-transform:uppercase;
            margin-bottom:.4em}
#media .htitle{font-size:clamp(16px,calc(15.3 * var(--u)),132px);font-weight:800;
               line-height:1.05;letter-spacing:.005em;text-transform:uppercase;
               /* Two lines rather than one truncated: a poster this size has
                  the room, and "The Fellowship of the R…" answers nothing. */
               display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
               overflow:hidden}
#media .hsub{font-size:clamp(10px,calc(7.5 * var(--u)),65px);color:#cbb9a6;
            margin-top:.25em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#media .heroInfo .prog{margin-top:clamp(8px,calc(6 * var(--u)),22px);
                       height:clamp(5px,calc(4.3 * var(--u)),16px)}

/* --------------------------------------------------------- unavailable
   A dead source says so. It never borrows the look of live data. */
.down{flex:1;display:grid;place-items:center;text-align:center;color:var(--slate)}
.down b{display:block;font-size:clamp(18px,calc(25.53 * var(--u)),140px);color:var(--dust);
        letter-spacing:.1em;margin-bottom:.25em}
.pill{font-size:.68em;font-weight:800;letter-spacing:.14em;color:#1a1509;
      background:var(--accent, var(--sodium));border-radius:.4em;padding:.2em .55em}
.card,#flag{animation:rise .6s cubic-bezier(.2,.7,.3,1) both}
#flag{animation-delay:.02s}
#racing{animation-delay:.10s} #weather{animation-delay:.16s}
#radar{animation-delay:.22s} #wire{animation-delay:.26s}
#media{animation-delay:.28s} #gallery{animation-delay:.30s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}
  #dust{display:none}}
</style>
</head>
<body class="no-media">
<div id="stage">
<div id="app">
  <canvas id="dust"></canvas>
  <!-- The staleness tell is fixed furniture: it sits outside the slot system
       so no arrangement can remove it.

       The corner clock is the fallback. It costs no cells and cannot be
       arranged away, so the board always shows the time — but it stands down
       the moment the clock module is given a slot, because two clocks a
       rounding-error apart reads as a fault rather than a feature. -->
  <div id="cornerclock"><span class="t">--:--</span><span class="d"></span></div>
  <div id="stale" hidden></div>

  <div id="flag" class="standby">
    <div class="checks l"></div><div class="checks r"></div>
    <div class="sheen"></div>
    <div class="word" id="flagWord">Connecting</div>
    <div class="sub" id="flagSub"></div>
  </div>

  <section class="card" id="racing">
    <header><h2>Racing</h2><span class="eyebrow right" id="racingAge"></span></header>
    <div class="body" id="racingBody"></div>
  </section>

  <section class="card" id="weather">
    <canvas id="sky"></canvas>
    <header><h2 id="wxWord">Weather</h2><span class="eyebrow right">Schenectady</span></header>
    <div id="wxAlert" hidden></div>
    <div class="body" id="wxBody"></div>
  </section>

  <section class="card" id="radar">
    <div class="rbox" id="radarBox">
      <div class="tiles" id="radarBase"></div>
      <div class="tiles" id="radarEcho"></div>
      <div class="pins" id="radarPins"></div>
      <div class="radarfoot">
        <span class="eyebrow" id="radarTime">—</span>
        <a class="eyebrow credit" href="https://www.rainviewer.com"
           >Weather data by RainViewer &middot; &copy; OpenStreetMap, CARTO</a>
      </div>
    </div>
  </section>

  <section class="card" id="gallery">
    <div class="body">
      <div class="gl" id="glA"></div>
      <div class="gl" id="glB"></div>
    </div>
  </section>

  <section class="card" id="wire">
    <div class="body">
      <div class="wmark"><span>Wire</span><span class="wage" id="wireAge">—</span></div>
      <div class="wrap" id="wireBody"></div>
    </div>
  </section>

  <section class="card" id="services">
    <div class="body">
      <div class="shead" id="svcHead">Services</div>
      <div class="svcs" id="svcBody"></div>
    </div>
  </section>

  <section class="card" id="pihole">
    <div class="body" id="phBody"></div>
  </section>

  <!-- Starts hidden: it has no fallback grid span in the stylesheet, so if
       layout.json fails to load it must not land in the auto-flow and shove
       the other cards sideways. A slot clears data-hide. -->
  <section class="card" id="clock" data-hide="1">
    <div class="body">
      <div class="ct"><span id="clkT">--:--</span><span class="cm" id="clkM"></span></div>
      <div class="cd" id="clkD"></div>

  <section class="card" id="system" data-hide="1">

      <div class="hhead"><span class="hdot"></span><span class="hword" id="sysWord">—</span>
           <span class="eyebrow right" id="sysUp"></span></div>
      <div class="hnote" id="sysNote"></div>
