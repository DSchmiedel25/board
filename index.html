<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------- tokens
   Same vocabulary as the Pixoo: warm dark ground, sodium for "next up",
   flag colours as the only saturated things on screen, one fixed colour per
   track so you find yours before you read it. */
:root{
  /* Taken from DirtCheck so the two never look like different products. */
  --loam:#100f0d;  --panel:#1b1917;  --sunk:#232120;  --rail:#37342f;
  --dust:#f0ebe0;  --slate:#8a8378;  --sodium:#e8b93f;
  --green:#5fbf5a; --red:#d9534a;   --yellow:#e8b93f;
  --gap:20px;
  --r:17px;
}
*{box-sizing:border-box;margin:0;padding:0}

/* The sodium wash of track lights, bleeding down from above the board. */
#app::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(120% 55% at 50% -12%,
    rgba(247,167,44,.16), rgba(247,167,44,.05) 45%, transparent 70%)}
/* Dust hanging in the air between you and the panel. */
#dust{position:absolute;inset:0;pointer-events:none;z-index:60;opacity:.75}
html,body{height:100%;overflow:hidden;background:#000;color:var(--dust)}

/* The board is a single 1920x1080 surface, scaled to whatever is showing it.
   A phone gets the identical layout, just smaller — no separate mobile
   version to keep in sync, and what you check on the way home is exactly
   what's on the wall. */
#stage{position:fixed;inset:0;overflow:hidden}
/* Centred by translate rather than by grid alignment: a grid item wider than
   its container resolves to start, which parks the scaled surface off-screen
   on a phone. */
#app{position:absolute;left:50%;top:50%;width:1920px;height:1080px;
     transform-origin:center center;background:var(--loam)}
body{
  font-family:"Barlow Condensed","Liberation Sans Narrow","Arial Narrow",
              Helvetica,Arial,sans-serif;
  font-size:22px;
  -webkit-font-smoothing:antialiased;
  transition:filter 3s linear;
}
.mono{font-family:"DejaVu Sans Mono",ui-monospace,Menlo,Consolas,monospace}
.eyebrow{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
         font-size:.6em;letter-spacing:.2em;text-transform:uppercase;
         color:var(--slate);font-weight:400}

/* ------------------------------------------------------------ structure */
#app{
  position:relative;z-index:2;
  padding:var(--gap);display:grid;gap:var(--gap);
  /* Now playing is a strip along the bottom rather than a fourth box in the
     left column — stacking four cards there squeezed the track rows into
     each other and clipped the last NASCAR series. */
  /* 12 x 18 uniform cells; every card's position comes from layout.json at
     runtime. Named areas can't express an arbitrary rectangle, which is what
     dragging produces. These are the fallback values used for the one poll
     cycle before layout.json arrives, and if it never does. */
  grid-template-columns:repeat(12,1fr);
  grid-template-rows:repeat(18,1fr);
}
/* With nothing playing, the weather column grows downward rather than the
   race rows stretching across the full width — three items spread over
   1900px reads as a gap, not a list. */
/* The bottom strip stays even with nothing playing — it shows services
   instead — so the grid keeps its fourth row either way. */
/* The bottom strip is always present: what's playing, or service health when
   nothing is. Only the inner card swaps. */
body.no-media #media{display:none}
/* Set by the layout resolver, not by hand. */
#app > [data-off="1"],#app > [data-lose="1"]{display:none!important}
.card{background:var(--panel);border-radius:var(--r);overflow:hidden;
      display:flex;flex-direction:column;min-height:0}
.card > header{padding:.7em 1.1em;display:flex;align-items:baseline;gap:1em;
               background:var(--sunk)}
.card > header h2{font-size:1.7em;letter-spacing:.06em;font-weight:900;
                  text-transform:uppercase}
.card > header .right{margin-left:auto}
.body{padding:var(--gap);display:flex;flex-direction:column;
      gap:calc(var(--gap)*.7);flex:1;min-height:0}

/* ---------------------------------------------------------- signature
   The flag strip is the whole point: one field, full width, that answers
   "is racing happening" from the doorway. Everything else is subordinate.
   On a green night it moves. */
#flag{grid-column:1/span 12;grid-row:1/span 3;border-radius:var(--r);position:relative;overflow:hidden;
      display:flex;align-items:center;gap:1.2em;
      padding:1em 1.2em;background:var(--sunk)}
#flag .word{font-size:96px;font-weight:900;line-height:.92;
            letter-spacing:.02em;text-transform:uppercase;position:relative}
#flag .sub{font-size:32px;font-weight:700;opacity:.8;
           margin-left:auto;text-align:right;line-height:1.2;color:inherit;
           text-transform:uppercase;letter-spacing:.14em}
#flag.racing{background:var(--green);color:#08240f}
#flag.rained{background:var(--red);color:#2a0b0a}
#flag.watch{background:var(--yellow);color:#2b2205}
#flag.standby{background:var(--sunk);color:var(--sodium)}
#flag.racing{color:#08210b}
#flag.offline{background:var(--rail);color:var(--dust)}
/* Two explicit flanks rather than a masked overlay — CSS mask sizing on a
   repeating conic-gradient proved unreliable, and this is easier to reason
   about anyway. */
#flag .checks{position:absolute;top:0;bottom:0;width:clamp(60px,9%,150px);
  opacity:0;pointer-events:none;
  background:conic-gradient(#fff 25%,#0000 0 50%,#fff 0 75%,#0000 0) 0 0/24px 24px;
  mix-blend-mode:soft-light}
#flag .checks.l{left:0}
#flag .checks.r{right:0}
#flag.racing .checks{opacity:.55;animation:march 2.2s linear infinite}
#flag .sheen{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.32) 50%,
             transparent 62%);transform:translateX(-100%)}
#flag.racing .sheen,#flag.rained .sheen,#flag.watch .sheen{
  opacity:1;animation:sweep 5.5s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-100%)}
                 55%,100%{transform:translateX(100%)}}
@keyframes march{to{background-position:48px 0}}

/* ------------------------------------------------------------- tracks */
#tracks{grid-column:1/span 7;grid-row:4/span 6}
/* Fixed columns rather than `1fr` pushing the times to the far edge — across
   a 1000px panel that opens a canyon between the name and the status. */
.track{display:grid;grid-template-columns:6px 470px 190px 1fr;gap:0 1.5em;
       align-items:center;background:var(--sunk);border-radius:12px;
       padding:.75em 1.2em;flex:1;min-height:0}
.track .bar{width:6px;height:100%;border-radius:3px;background:var(--rail)}
/* nowrap: the fallback face is wider than Barlow Condensed, and a name
   breaking onto two lines wrecks the row rhythm. */
.track h3{font-size:40px;font-weight:700;line-height:1.05;
          text-transform:uppercase;letter-spacing:.01em;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .town{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
             font-size:.66em;color:var(--slate);letter-spacing:.14em;
             text-transform:uppercase}
.track .when{font-size:36px;font-weight:700;
             text-align:left;line-height:1.1}
.track .rain{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
             font-size:.66em;color:var(--slate);text-align:left;
             letter-spacing:.08em}
/* DirtCheck marks a track by its status, not its name — green means racing.
   Borrowing that keeps one meaning for one colour across both screens. */
.track .bar{background:var(--rail)}
.track h3{color:var(--dust)}
.track.live .bar{background:var(--green)}
.track.dark h3{color:var(--slate)}
.track.dark .bar{opacity:.5}
.track .status{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
  font-size:.68em;letter-spacing:.16em;color:var(--green);text-align:left}
.track.dark .status{color:var(--slate)}
.track.live .when{color:var(--dust)}
.track.live{background:linear-gradient(90deg,rgba(247,167,44,.10),transparent 55%);
            animation:idle 3.6s ease-in-out infinite}
@keyframes idle{0%,100%{box-shadow:inset 0 0 0 0 rgba(247,167,44,0)}
                50%{box-shadow:inset 0 0 44px -14px rgba(247,167,44,.55)}}

/* ------------------------------------------------------------ weather */
#weather{grid-column:8/span 5;grid-row:4/span 10;position:relative;background:#1d3a63}
#weather .body{position:relative;z-index:2}
#sky{position:absolute;inset:0;z-index:0;width:100%;height:100%}
#weather header{background:rgba(0,0,0,.28);position:relative;z-index:2}
.wxmain{display:flex;align-items:center;gap:.4em;flex:1}
.wxtemp{font-size:168px;font-weight:900;line-height:.8;
        letter-spacing:-.02em}
.tempwrap{display:flex;align-items:baseline;gap:.08em}
.wxdeg{font-size:44px;font-weight:700;opacity:.7}
.wxsub{margin-left:auto;text-align:right;font-size:.86em;line-height:1.7;color:#dbe6f7}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em;margin-top:auto;
      border-top:1px solid rgba(255,255,255,.28);padding-top:.7em}
.day{text-align:center}
.day .n{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
        font-size:.68em;color:#c3d4ec;letter-spacing:.18em}
.day .hi{font-size:42px;font-weight:800;line-height:1.15}
.day .lo{font-size:.86em;color:#b3c6e2}

/* -------------------------------------------------------------- radar
   Fixed tiles rather than a mapping library: a wall panel never pans or
   zooms, so there is nothing for Leaflet to do, and one fewer CDN to be
   offline when the internet is. */
#radar{position:relative;flex:1;min-height:0;overflow:hidden;
       border-top:1px solid rgba(255,255,255,.18);z-index:2}
#radar .tiles{position:absolute;top:0;left:0;width:100%;height:100%;
              transform-origin:0 0}
#radar .pins{position:absolute;inset:0}
#radar .tiles img{position:absolute;image-rendering:auto}
/* CARTO's dark basemap measures ~12/255 mean brightness on its own — dimming
   it further left a black rectangle. It gets lifted instead, and the radar
   still reads clearly on top because the echoes are saturated colour against
   a desaturated map. */
#radarBase img{filter:brightness(2.6) contrast(1.08) saturate(.45)}
#radarEcho img{opacity:0;transition:opacity .18s linear;mix-blend-mode:screen}
#radarEcho img.on{opacity:.92}
#radar .pin{position:absolute;transform:translate(-50%,-50%);
            width:11px;height:11px;border-radius:50%;
            box-shadow:0 0 0 2px rgba(0,0,0,.65)}
#radar .pin b{position:absolute;left:15px;top:-5px;font-size:15px;
              font-weight:800;letter-spacing:.06em;white-space:nowrap;
              text-shadow:0 1px 3px #000,0 0 8px #000}
#radar .radarfoot{position:absolute;left:0;right:0;bottom:0;display:flex;
  gap:1em;padding:.35em .8em;background:linear-gradient(transparent,#000a 55%)}
#radar .credit{margin-left:auto;opacity:.5;text-decoration:none;
               color:inherit}

/* ------------------------------------------------------------- nascar */
#nascar{grid-column:1/span 7;grid-row:10/span 4}
#nascar .body{flex-direction:row;gap:var(--gap)}
.series{flex:1.15;display:flex;flex-direction:column;gap:.5em;min-width:0;
        justify-content:space-around}
.srow{display:flex;align-items:center;gap:1.4em}
.srow .stack{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.srow .stack.left{flex:0 0 210px}      /* series + track, fixed so the
                                          times line up down the column */
.srow .stack.mid{flex:0 0 150px}
.srow .name{font-size:30px;font-weight:700;letter-spacing:.06em;
            text-transform:uppercase;color:var(--dust);line-height:1.05}
.srow .where{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
             font-size:15px;letter-spacing:.13em;color:var(--sodium);
             text-transform:uppercase;white-space:nowrap;overflow:hidden;
             text-overflow:ellipsis}
.srow .date{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
            font-size:15px;letter-spacing:.13em;color:#c9bda9;
            text-transform:uppercase}
.srow .time{font-size:28px;font-weight:700}
.srow .net{background:var(--sunk);color:var(--sodium);font-weight:800;
           border-radius:.4em;padding:.22em .6em;font-size:19px;
           text-align:center;min-width:3.4em;flex:none}
.srow.live .time{color:var(--green);font-weight:800}
.podium{flex:1;border-left:1px solid var(--rail);padding-left:var(--gap);
        display:flex;flex-direction:column;gap:.5em;min-width:0}

/* The whole field rather than a top three. The list is duplicated once and
   translated by exactly half its height, so the loop is seamless — a scroll
   that snapped back to the top would read as a glitch from across a room. */
.fieldbox{position:relative;flex:1;min-height:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(#0000,#000 8%,#000 88%,#0000 100%);
          mask-image:linear-gradient(#0000,#000 8%,#000 88%,#0000 100%)}
.fieldroll{position:absolute;top:0;left:0;right:0;
           animation:roll linear infinite}
@keyframes roll{to{transform:translateY(-50%)}}
.frow{display:grid;grid-template-columns:40px 56px 1fr;align-items:baseline;
      gap:0 .7em;padding:.17em 0}
.frow .pos{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
           font-size:17px;color:var(--slate);text-align:right}
.frow .car{font-family:"DejaVu Sans Mono",ui-monospace,monospace;
           font-size:17px;color:var(--sodium)}
.frow .dvr{font-size:22px;font-weight:700;letter-spacing:.03em;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Podium colours only where a finish has actually happened */
.podium.result .frow:nth-child(1) .pos,
.podium.result .frow:nth-child(1) .dvr{color:#ffd65c}
.podium.result .frow:nth-child(2) .pos,
.podium.result .frow:nth-child(2) .dvr{color:#dfe4ea}
.podium.result .frow:nth-child(3) .pos,
.podium.result .frow:nth-child(3) .dvr{color:#d99a5c}

/* --------------------------------------------------------------- wire
   Three headlines, fixed slots, swapped on a timer. A scrolling ticker is
   the obvious move and the wrong one: anything in constant motion at the
   edge of vision pulls your eye off whatever you were actually reading.
   These sit still for 22 seconds and then cross-fade. */
#wire{grid-column:1/span 12;grid-row:14/span 2}
#wire > header{display:none}          /* 128px tall; a header eats a third */
#wire .body{flex-direction:row;align-items:stretch;gap:var(--gap);
            padding:14px var(--gap)}
.wmark{font-family:"DejaVu Sans Mono",ui-monospace,monospace;font-size:15px;
       letter-spacing:.18em;text-transform:uppercase;color:var(--slate);
       flex:none;padding-right:var(--gap);border-right:1px solid var(--rail);
       display:flex;flex-direction:column;justify-content:center;gap:.35em}
.wmark .wage{color:var(--sodium)}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column;
      justify-content:space-around}
.wrow{display:flex;align-items:baseline;gap:1em;min-width:0;
      transition:opacity .55s ease}
.wrow.out{opacity:0}
.wsrc{font-family:"DejaVu Sans Mono",ui-monospace,monospace;font-size:14px;
      letter-spacing:.14em;color:var(--sodium);flex:0 0 74px;
      text-align:right;text-transform:uppercase}
/* One line, always. A headline that wraps to two pushes the row below it
   off the card, and the layout has no room to absorb that. */
.wtitle{font-size:29px;font-weight:700;letter-spacing:.02em;flex:1;
        min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        line-height:1.12}
.wtime{font-family:"DejaVu Sans Mono",ui-monospace,monospace;font-size:14px;
       color:var(--slate);flex:none}
.wnone{color:var(--slate);font-size:20px;align-self:center}
/* Marquee: the rows are laid end to end on one line and translated. The set
   is duplicated so the loop is seamless — a scroll that snapped back to the
   start would read as a glitch, the same reason the NASCAR field roll is
   doubled. */
#wire[data-mode="marquee"] .wrap{flex-direction:row;flex-wrap:nowrap;
  overflow:hidden;align-items:center;
  -webkit-mask-image:linear-gradient(90deg,#0000,#000 3%,#000 97%,#0000);
          mask-image:linear-gradient(90deg,#0000,#000 3%,#000 97%,#0000)}
#wire[data-mode="marquee"] .wrow{flex:0 0 auto;padding-right:3em;
  animation:wmarch linear infinite;opacity:1}
#wire[data-mode="marquee"] .wtitle{white-space:nowrap;overflow:visible;flex:0 0 auto}
@keyframes wmarch{to{transform:translateX(-100%)}}

/* -------------------------------------------------------------- gallery
   Two stacked layers so one item can fade into the next without either
   flickering through the background. Each layer holds its own blurred
   backdrop, because the fill has to travel with the image it belongs to. */
#gallery{grid-column:1/span 12;grid-row:1/span 13;position:relative;
         overflow:hidden;background:#080706}
#gallery > header{display:none}
#gallery .body{padding:0;position:relative}
.gl{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.gl.on{opacity:1}
.gl .back{position:absolute;inset:0;background-size:cover;background-position:center;
          filter:blur(60px) saturate(1.8) brightness(.5);transform:scale(1.35)}
.gl img,.gl video{position:absolute;inset:0;width:100%;height:100%;
                  object-fit:contain;z-index:1}
#gallery[data-fit="cover"] .gl img,#gallery[data-fit="cover"] .gl video{
  object-fit:cover}
#gallery[data-fit="cover"] .gl .back{display:none}
.glnone{position:absolute;inset:0;display:flex;align-items:center;
        justify-content:center;color:var(--slate);font-size:26px;
        text-align:center;padding:2em}

/* -------------------------------------------------------------- media */
/* Services share the media slot; only one is ever visible. */
#services{grid-column:1/span 12;grid-row:16/span 3;position:relative;overflow:hidden}
/* .card sets display:flex, which outranks the hidden attribute's default */
#services[hidden]{display:none}
#services .body{flex-direction:row;align-items:center;gap:var(--gap)}
.shead{font-family:"DejaVu Sans Mono",ui-monospace,monospace;font-size:15px;
       letter-spacing:.18em;text-transform:uppercase;flex:none;
       padding-right:var(--gap);border-right:1px solid var(--rail)}
.shead.ok{color:var(--green)} .shead.bad{color:var(--red)}
.svcs{display:flex;align-items:center;gap:calc(var(--gap)*1.4);flex:1;
      min-width:0;flex-wrap:wrap}
.svc{display:flex;align-items:baseline;gap:9px;min-width:0}
.sdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--green)}
.svc.dn .sdot{background:var(--red)}
.sname{font-size:24px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.svc.dn .sname{color:var(--dust)} .svc.up .sname{color:#bdb1a2}
.spct{font-family:"DejaVu Sans Mono",ui-monospace,monospace;font-size:14px;
      color:var(--slate)}
.svcnone{color:var(--slate);font-size:20px}

#media{grid-column:1/span 12;grid-row:16/span 3;position:relative;overflow:hidden}
/* No card header on the strip: at 152px tall it would eat half the space,
   so the label rides inline with the title instead. */
#media > header{display:none}

/* The panel takes the colour of whatever is on — the same trick the LIFX
   bulb plays, so the room and the board agree. Heavy blur keeps it as light
   rather than a picture competing with the one beside it. */
#media .backdrop{position:absolute;inset:0;z-index:0;
  background-size:cover;background-position:center;
  filter:blur(52px) saturate(2.1) brightness(1.15);
  transform:scale(1.4);opacity:.85;
  transition:background-image .6s ease}
#media .scrim{position:absolute;inset:0;z-index:1;
  background:linear-gradient(100deg,rgba(18,14,11,.18) 0 18%,
             rgba(18,14,11,.62) 52%,rgba(18,14,11,.86) 100%)}
#media > header,#media .body{position:relative;z-index:2}
#media > header{background:rgba(18,14,11,.42);backdrop-filter:blur(8px)}
#media .body{flex-direction:row;gap:calc(var(--gap)*1.3);align-items:center;
             padding:14px var(--gap)}
#poster{height:100%;aspect-ratio:2/3;border-radius:calc(var(--r)*.6);
        object-fit:cover;background:var(--sunk);flex:none;
        box-shadow:0 12px 30px -8px rgba(0,0,0,.75),
                   0 0 0 1px rgba(255,255,255,.09);
        animation:poster .7s cubic-bezier(.2,.7,.3,1) both}
@keyframes poster{from{opacity:0;transform:translateY(10px) scale(.97)}}
#poster[data-empty]{display:none}
/* Explicit rows: with implicit ones the title and the progress bar landed
   in the same track and overlapped. */
.meta{display:grid;grid-template-columns:auto 1fr auto;
      grid-template-rows:auto auto auto;align-items:center;
      gap:4px 1.4em;min-width:0;flex:1;align-content:center}
.meta .title{grid-row:1;grid-column:1;font-size:34px;font-weight:700;line-height:1.05;
             text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.meta .ep{grid-row:1;grid-column:2;color:#cbb9a6;font-size:.95em;letter-spacing:.02em;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .who{grid-row:1;grid-column:3;color:var(--sodium);font-weight:700;
           letter-spacing:.06em;white-space:nowrap}
.prog{grid-row:2;grid-column:1/4;height:8px;border-radius:4px;background:var(--rail);
      margin-top:6px}
.prog i{display:block;height:100%;border-radius:.25em;background:var(--sodium)}
.left{grid-row:3;grid-column:1/4;font-size:.78em;color:var(--slate);margin-top:3px}

/* The strip is wide and short, so several watchers sit side by side as equal
   cells rather than one hero with the rest crammed into a sidebar. */
.streams{display:flex;align-items:stretch;gap:var(--gap);flex:1;min-width:0}
/* stretch, not center: with centred children the row height is indefinite,
   so the poster's height:100% fell back to its natural 600px and swallowed
   half the strip. */
.stream{display:flex;align-items:stretch;gap:16px;flex:1;min-width:0}
.stream + .stream{border-left:1px solid rgba(255,255,255,.16);
                  padding-left:var(--gap)}
/* Sized by width, not height: a percentage height against an indefinite row
   resolves to the image's natural 600px, which ate half the strip. */
.stream .art{width:82px;height:auto;aspect-ratio:2/3;border-radius:9px;
             object-fit:cover;background:var(--sunk);flex:0 0 auto;
             align-self:center;
             box-shadow:0 10px 24px -8px rgba(0,0,0,.7),
                        0 0 0 1px rgba(255,255,255,.08)}
.stream .art[data-empty]{display:none}
.sinfo{display:flex;flex-direction:column;justify-content:center;gap:3px;
       min-width:0;flex:1}
.stitle{font-size:30px;font-weight:700;text-transform:uppercase;line-height:1.05;
        letter-spacing:.01em;white-space:nowrap;overflow:hidden;
        text-overflow:ellipsis}
.ssub{font-size:16px;color:#cbb9a6;white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis}
.swho{font-family:"DejaVu Sans Mono",ui-monospace,monospace;font-size:14px;
      letter-spacing:.16em;color:var(--sodium)}
.stream .prog{margin-top:5px;height:7px}
#media[data-n="2"] .stitle{font-size:26px}
#media[data-n="3"] .stitle{font-size:21px}
#media[data-n="3"] .ssub{font-size:14px}

/* --------------------------------------------------------- unavailable
   A dead source says so. It never borrows the look of live data. */
.down{flex:1;display:grid;place-items:center;text-align:center;color:var(--slate)}
.down b{display:block;font-size:40px;color:var(--dust);
        letter-spacing:.1em;margin-bottom:.25em}
.pill{font-size:.68em;font-weight:800;letter-spacing:.14em;color:#1a1509;
      background:var(--sodium);border-radius:.4em;padding:.2em .55em}
.card,#flag{animation:rise .6s cubic-bezier(.2,.7,.3,1) both}
#flag{animation-delay:.02s}
#tracks{animation-delay:.10s} #weather{animation-delay:.16s}
#nascar{animation-delay:.22s} #media{animation-delay:.28s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}
  #dust{display:none}}
</style>
</head>
<body class="no-media">
<div id="stage">
<div id="app">
  <canvas id="dust"></canvas>
  <div id="flag" class="standby">
    <div class="checks l"></div><div class="checks r"></div>
    <div class="sheen"></div>
    <div class="word" id="flagWord">Connecting</div>
    <div class="sub" id="flagSub"></div>
  </div>

  <section class="card" id="tracks">
    <header><h2>Tracks</h2><span class="eyebrow right" id="tracksAge"></span></header>
    <div class="body" id="trackBody"></div>
  </section>

  <section class="card" id="weather">
    <canvas id="sky"></canvas>
    <header><h2 id="wxWord">Weather</h2><span class="eyebrow right">Schenectady</span></header>
    <div class="body" id="wxBody"></div>
    <div id="radar">
      <div class="tiles" id="radarBase"></div>
      <div class="tiles" id="radarEcho"></div>
      <div class="pins" id="radarPins"></div>
      <div class="radarfoot">
        <span class="eyebrow" id="radarTime">—</span>
        <a class="eyebrow credit" href="https://www.rainviewer.com"
           >Weather data by RainViewer &middot; &copy; OpenStreetMap, CARTO</a>
      </div>
    </div>
  </section>

  <section class="card" id="nascar">
    <header><h2 id="ncVenue">NASCAR</h2><span class="eyebrow right">Next race per series</span></header>
    <div class="body" id="ncBody"></div>
  </section>

  <section class="card" id="gallery">
    <div class="body">
      <div class="gl" id="glA"></div>
      <div class="gl" id="glB"></div>
    </div>
  </section>

  <section class="card" id="wire">
    <div class="body">
      <div class="wmark"><span>Wire</span><span class="wage" id="wireAge">—</span></div>
      <div class="wrap" id="wireBody"></div>
    </div>
  </section>

  <section class="card" id="services">
    <div class="body">
      <div class="shead" id="svcHead">Services</div>
      <div class="svcs" id="svcBody"></div>
    </div>
  </section>

  <section class="card" id="media">
    <div class="backdrop" id="backdrop"></div>
    <div class="scrim"></div>
    <header><h2>Now playing</h2></header>
    <div class="body" id="mediaBody"></div>
  </section>
</div>
</div>

<script>
const $ = s => document.querySelector(s);
/* Headlines are the only strings on the board that come from outside the
   house. Six third-party feeds put an ampersand or a stray bracket in a
   title sooner or later, and one of them breaks the row it lands in. */
const esc = t => String(t == null ? "" : t)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

/* Scale the fixed surface to fill whatever screen it lands on. */
function fit(){
  const app = $("#app");
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
}
addEventListener("resize", fit);
addEventListener("orientationchange", () => setTimeout(fit, 120));
fit();

/* Dust hanging under the lights. Slow, sparse and warm — it should read as
   atmosphere you notice on the second look, not as falling snow. */
(function dustField(){
  const c=$("#dust"), x=c.getContext("2d");
  let bits=[];
  function seed(){
    c.width=1920; c.height=1080;
    bits=Array.from({length:80},()=>({
      x:Math.random()*c.width, y:Math.random()*c.height,
      r:Math.random()*1.7+.5, vx:.06+Math.random()*.22,
      a:.06+Math.random()*.22, p:Math.random()*7,
    }));
  }
  function paint(){
    x.clearRect(0,0,c.width,c.height);
    bits.forEach(b=>{
      b.x+=b.vx; b.p+=.006;
      if(b.x>c.width+4){b.x=-4; b.y=Math.random()*c.height;}
      const y=b.y+Math.sin(b.p)*7;
      x.fillStyle=`rgba(247,206,150,${b.a})`;
      x.beginPath(); x.arc(b.x,y,b.r,0,7); x.fill();
    });
    requestAnimationFrame(paint);
  }
  seed(); paint();
})();

/* Values roll to their new figure like a scoreboard wheel instead of
   blinking. Only worth doing where the number is big enough to watch. */
function roll(el, to, ms=700){
  const from = parseFloat(el.dataset.v);
  el.dataset.v = to;
  if (!isFinite(from) || from === to){ el.textContent = to; return; }
  const t0 = performance.now();
  (function step(now){
    const k = Math.min(1,(now-t0)/ms), e = 1-Math.pow(1-k,3);
    el.textContent = Math.round(from + (to-from)*e);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
const POLL = 15000;

/* Night dimming. A wall panel at full brightness at 2am is miserable, so the
   page follows the same schedule the Pixoo uses. */
function dim(hour){
  const night = hour >= 22 || hour < 6;
  document.body.style.filter = night ? "brightness(.42) saturate(.9)" : "brightness(1)";
}

const FLAG = {
  racing:["Racing tonight","racing"], rained:["Rained out","rained"],
  watch:["Watching weather","watch"], standby:["No racing tonight","standby"],
};

function renderFlag(dirt){
  const el = $("#flag");
  const status = dirt.status || "OK";
  let [word, cls] = FLAG[dirt.state] || ["Unknown","offline"];
  let sub = dirt.label || "";
  if (status === "OFFLINE" || status === "UNKNOWN"){
    word = "DirtCheck unreachable"; cls = "offline";
    sub = "Showing nothing rather than guessing";
  } else if (status === "STALE"){
    cls = "offline";                       /* never green on old data */
    sub = "Last known — source is not responding";
  }
  el.className = cls;
  $("#flagWord").textContent = word;
  $("#flagSub").textContent = sub;
}

const NAMES = {AS:["Albany-Saratoga","Malta NY"], LV:["Lebanon Valley","W Lebanon NY"],
               FON:["Fonda","Fonda NY"]};

function renderTracks(dirt){
  const body = $("#trackBody"), status = dirt.status || "OK";
  if (status === "OFFLINE" || status === "UNKNOWN" || !(dirt.rows||[]).length){
    body.innerHTML = `<div class="down"><div><b>No data</b>Can't reach DirtCheck</div></div>`;
    $("#tracksAge").textContent = ""; return;
  }
  $("#tracksAge").innerHTML = status === "STALE" ? `<span class="pill">Stale</span>` : "";
  body.innerHTML = dirt.rows.slice(0,3).map(r=>{
    const [name,town] = NAMES[r.code] || [r.code,""];
    const live = r.state && r.state !== "dark";
    return `<div class="track ${live?"live":"dark"}" data-code="${r.code}">
      <div class="bar"></div>
      <div><h3>${name}</h3><div class="town">${town}</div></div>
      <div><div class="when">${r.when||"—"}</div>
           <div class="status">${live?"GREEN":"DARK"}</div>
           <div class="rain">${r.prob==null?"":r.prob+"% RAIN"}</div></div>
    </div>`;
  }).join("");
}

function renderWeather(wx){
  const body = $("#wxBody"), status = wx.status || "OK";
  if (status === "OFFLINE" || status === "UNKNOWN" || wx.temp == null){
    $("#wxWord").textContent = "Weather";
    body.innerHTML = `<div class="down"><div><b>No data</b>Can't reach Open-Meteo</div></div>`;
    return;
  }
  const w = (wx.sky||"clear");
  $("#wxWord").textContent = w.charAt(0).toUpperCase()+w.slice(1);

  const live = body.querySelector(".wxtemp");
  if (live){                                   // already built — just move it
    roll(live, wx.temp);
    body.querySelector(".wxsub").innerHTML =
      `Feels ${wx.feels}&deg;<br>Wind ${wx.wind} mph<br>${wx.rain}% rain`;
    return;
  }
  body.innerHTML = `
    <div class="wxmain">
      <div class="tempwrap"><div class="wxtemp" data-v="${wx.temp}">${wx.temp}</div>
        <div class="wxdeg">&deg;F</div></div>
      <div class="wxsub">Feels ${wx.feels}&deg;<br>Wind ${wx.wind} mph<br>${wx.rain}% rain</div>
    </div>
    <div class="days">${(wx.days||[]).map(d=>`
      <div class="day"><div class="n">${d[0]}</div>
        <div class="hi">${d[1]}&deg;</div><div class="lo">${d[2]}&deg;</div></div>`).join("")}
    </div>`;
}

function fieldRows(fl){
  return fl.rows.map(r=>`<div class="frow">
      <span class="pos">${r[0]}</span>
      <span class="car">${r[2] ? "#" + r[2] : ""}</span>
      <span class="dvr">${r[1]}</span>
    </div>`).join("");
}

function renderNascar(nc){
  const body = $("#ncBody");
  if (!nc || !(nc.rows||[]).length){
    body.innerHTML = `<div class="down"><div><b>No data</b>Can't reach ESPN</div></div>`;
    return;
  }
  $("#ncVenue").textContent = nc.live ? "Racing now" : "NASCAR";
  const LONG = {CUP:"Cup Series", XFN:"Xfinity", TRK:"Trucks"};
  const series = nc.rows.map(r=>{
    /* Fall back to the short form if an older snapshot has no date field,
       so the row still says something useful rather than going blank. */
    const when = r.live ? "RACING" : (r.time || r.when || "");
    const day  = r.date || (r.when || "").split(" ")[0] || "";
    return `
    <div class="srow ${r.live?"live":""}">
      <span class="stack left">
        <span class="name">${LONG[r.label]||r.label}</span>
        <span class="where">${r.venue||""}</span>
      </span>
      <span class="stack mid">
        <span class="date">${day}</span>
        <span class="time mono">${when}</span>
      </span>
      <span class="net">${r.net||""}</span>
    </div>`;}).join("");
  const fl = nc.field;
  const pod = fl ? `<div class="podium ${fl.kind||"result"}">
      <div class="eyebrow">${fl.label || "Field"} &middot; ${fl.venue}</div>
      <div class="fieldbox"><div class="fieldroll" id="fieldRoll">
        ${fieldRows(fl)}${fieldRows(fl)}
      </div></div>
    </div>` : "";
  body.innerHTML = `<div class="series">${series}</div>${pod}`;

  const roll = $("#fieldRoll");
  if (roll){
    // ~26px per second regardless of how many cars took the green
    requestAnimationFrame(() => {
      const secs = (roll.scrollHeight / 2) / 26;
      roll.style.animationDuration = Math.max(12, secs) + "s";
    });
  }
}

function renderServices(svc){
  const box = $("#svcBody");
  if (!box) return;
  if (!svc || svc.offline || !(svc.rows||[]).length){
    box.innerHTML = `<div class="svcnone">Uptime Kuma unreachable</div>`;
    $("#svcHead").textContent = "Services";
    $("#svcHead").className = "shead bad";
    return;
  }
  const bad = (svc.down||[]).length;
  $("#svcHead").textContent = bad
    ? `${bad} down` : `All ${svc.total} up`;
  $("#svcHead").className = "shead " + (bad ? "bad" : "ok");
  box.innerHTML = svc.rows.map(r => `
    <div class="svc ${r.up?"up":"dn"}">
      <span class="sdot"></span>
      <span class="sname">${r.name}</span>
      <span class="spct">${r.uptime!=null ? r.uptime.toFixed(1)+"%" : ""}</span>
    </div>`).join("");
}

function renderMedia(jf){
  const on = jf && jf.playing;
  document.body.classList.toggle("no-media", !on);
  // The bottom strip is one slot: what's playing, or service health when
  // nothing is. No new real estate needed for either.
  $("#services").hidden = on;
  if (!on) return;

  // Everyone watching, not just the one the Pixoo picked. Two streams sit
  // side by side; beyond that they stack as compact rows, because a wall
  // panel should never hide the fact that somebody else is watching.
  const all = (jf.all && jf.all.length) ? jf.all : [jf];
  document.getElementById("media").dataset.n = Math.min(all.length, 3);
  /* Cache-bust on the title, not the clock: a new bust every poll would
     refetch the same image four times a minute and restart its animation. */
  const key = encodeURIComponent((jf.title||"") + (jf.sub||""));
  const src = jf.poster ? `${jf.poster}?k=${key}` : "";
  const back = $("#backdrop");
  back.style.backgroundImage = src ? `url("${src}")` : "none";
  const cells = all.map((v, i) => `
    <div class="stream">
      ${i === 0 && src
        ? `<img class="art" src="${src}" alt="" decoding="async"
             onerror="this.setAttribute('data-empty','')">`
        : ""}
      <div class="sinfo">
        <div class="swho">${(v.user||"").toUpperCase()}${v.paused?" &middot; PAUSED":""}</div>
        <div class="stitle">${v.title||""}</div>
        <div class="ssub">${v.sub||""}</div>
        <div class="prog"><i style="width:${v.pct||0}%"></i></div>
      </div>
    </div>`).join("");

  $("#mediaBody").innerHTML = `<div class="streams">${cells}</div>`;
}

/* -------------------------------------------------------------- gallery
   Photos, GIFs-turned-MP4 and clips, from wall/index.json. Two layers swap
   so the outgoing item is still on screen while the incoming one loads —
   a single element flashes the background between items.

   Video runs its own length rather than the dwell slider: cutting a clip at
   an arbitrary 8 seconds looks like a fault. The dwell applies to stills. */
const GALLERY_POLL = 60000;
let glItems = [], glOrder = [], glAt = 0, glLayer = 0, glTimer = null,
    glSig = "", glOpts = {dwell: 8, order: "shuffle", show: ["still","video"], fit: "contain"};

function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function glBuildOrder(){
  const want = glOpts.show || ["still","video"];
  const pool = glItems
    .map((it, i) => [it, i])
    .filter(([it]) => want.includes(it.type))
    .map(([, i]) => i);
  glOrder = glOpts.order === "sequence" ? pool : shuffle(pool.slice());
  glAt = 0;
}

/* The board runs two requestAnimationFrame canvas loops. Adding H.264 decode
   on top is where a Pi 4 starts dropping frames, so the dust layer stands
   down while a clip is playing and comes back when it ends. */
function glDust(off){
  const d = document.getElementById("dust");
  if(d) d.style.display = off ? "none" : "";
}

function glNext(){
  clearTimeout(glTimer);
  const host = $("#gallery");
  if(!glOrder.length){
    $("#glA").innerHTML = `<div class="glnone">Nothing uploaded yet</div>`;
    $("#glA").classList.add("on"); $("#glB").classList.remove("on");
    glDust(false);
    return;
  }
  const it = glItems[glOrder[glAt % glOrder.length]];
  glAt = (glAt + 1) % glOrder.length;
  if(glAt === 0 && glOpts.order !== "sequence") glBuildOrder();   // reshuffle each pass

  const next = glLayer ? $("#glA") : $("#glB");
  const cur  = glLayer ? $("#glB") : $("#glA");
  const url = "data/wall/" + it.file;
  let hold = (glOpts.dwell || 8) * 1000;

  if(it.type === "video"){
    glDust(true);
    next.innerHTML = `<video src="${url}" autoplay muted loop playsinline></video>`;
    // Its own duration, floored so a one-second GIF doesn't strobe.
    hold = Math.max(4, it.dur || 8) * 1000;
  }else{
    glDust(false);
    next.innerHTML = `<div class="back" style="background-image:url('${url}')"></div>
                      <img src="${url}" alt="" decoding="async">`;
  }
  host.dataset.fit = glOpts.fit || "contain";
  next.classList.add("on"); cur.classList.remove("on");
  glLayer = glLayer ? 0 : 1;
  // Free the decoder on the layer that just left, or a long rotation ends up
  // holding every clip it has ever played.
  setTimeout(() => { if(!cur.classList.contains("on")) cur.innerHTML = ""; }, 1000);
  glTimer = setTimeout(glNext, hold);
}

async function loadGallery(){
  try{
    const r = await fetch("data/wall/index.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    const sig = JSON.stringify((d.items||[]).map(i => i.file));
    if(sig !== glSig){ glSig = sig; glItems = d.items || []; glBuildOrder();
                       if(!glTimer) glNext(); }
  }catch(e){
    if(!glItems.length){ glBuildOrder(); glNext(); }
  }
}

/* Settings arrive with the layout, so a change to the dwell slider restarts
   the rotation on the next poll rather than waiting out the old timer. */
function glApplyOpts(o){
  if(!o) return;
  const before = JSON.stringify(glOpts);
  glOpts = Object.assign({}, glOpts, o);
  if(JSON.stringify(glOpts) !== before){ glBuildOrder(); glNext(); }
}

/* --------------------------------------------------------------- layout
   Position comes from layout.json, written by the editor on 8081. Applied as
   inline styles on each card, which outrank the stylesheet's fallback spans —
   so a missing or unreachable layout.json leaves the board in its default
   arrangement rather than collapsing every card into cell 1,1.

   Polled on its own short interval because editing is interactive: you drag
   on the couch and want the wall to agree before you've put the phone down. */
const LAYOUT_POLL = 10000;
let layoutSig = "", layoutOrder = [];

function applyLayout(doc){
  const mods = (doc && doc.modules) || null;
  if(!mods) return;
  const sig = JSON.stringify(mods) + ":" + doc.gap;
  if(sig === layoutSig) return;        // don't touch the DOM on an unchanged poll
  layoutSig = sig;

  const app = document.getElementById("app");
  if(typeof doc.gap === "number") app.style.setProperty("--gap", doc.gap + "px");

  if(Array.isArray(doc.order)) layoutOrder = doc.order;
  if(mods.gallery) glApplyOpts(mods.gallery.opts);
  if(mods.wire)    wireApplyOpts(mods.wire.opts);

  for(const key in mods){
    const m = mods[key];
    const el = document.getElementById(key);
    if(!el) continue;
    el.style.gridColumn = m.col + " / span " + m.w;
    el.style.gridRow    = m.row + " / span " + m.h;
    /* A module switched off is hidden outright rather than left at zero size:
       a collapsed card still claims its cells and shoves its neighbours. */
    el.dataset.off = m.on ? "" : "1";
    el.dataset.pri = m.priority || 0;
  }
  resolveSlots();
}

/* Overlap is legal — it's how the media strip takes the services slot while
   something is playing. Cards that share any cell are compared by priority,
   and only the highest one that currently has something to show stays up. */
function resolveSlots(){
  /* Tie-break order comes from layout.json, not from where the cards happen
     to sit in the markup. The editor predicts the winner from the same list,
     so what it warns about is what actually happens. */
  const cards = (layoutOrder.length
      ? layoutOrder.map(k => document.getElementById(k)).filter(Boolean)
      : [...document.querySelectorAll("#app > .card, #app > #flag")])
    .filter(el => el.dataset.off !== "1");
  const box = el => {
    const cs = getComputedStyle(el);
    const col = parseInt(cs.gridColumnStart) || 1, row = parseInt(cs.gridRowStart) || 1;
    const w = parseInt((cs.gridColumnEnd||"").replace(/\D/g,"")) || 1;
    const h = parseInt((cs.gridRowEnd||"").replace(/\D/g,"")) || 1;
    return {col, row, w, h};
  };
  const hits = (a, b) => a.col < b.col+b.w && b.col < a.col+a.w &&
                         a.row < b.row+b.h && b.row < a.row+a.h;
  cards.forEach(el => { el.dataset.lose = ""; });
  for(let i = 0; i < cards.length; i++){
    for(let j = i+1; j < cards.length; j++){
      const A = cards[i], B = cards[j];
      if(!hits(box(A), box(B))) continue;
      const pa = (+A.dataset.pri||0) + (hasContent(A) ? 100 : 0);
      const pb = (+B.dataset.pri||0) + (hasContent(B) ? 100 : 0);
      (pa >= pb ? B : A).dataset.lose = "1";
    }
  }
}

/* "Has something to show" is per-module. Now playing is the only one that
   genuinely empties out; the rest always have content, so they default true
   and win on priority alone. */
function hasContent(el){
  if(el.id === "media")   return !document.body.classList.contains("no-media");
  /* An empty gallery must not win a slot from whatever it was stacked under,
     or an unused board goes blank instead of falling back. */
  if(el.id === "gallery") return glItems.length > 0;
  return true;
}

async function loadLayout(){
  try{
    const r = await fetch("data/layout.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    applyLayout(await r.json());
  }catch(e){ /* stylesheet fallback stands */ }
}

/* ----------------------------------------------------------------- wire
   news.json is written by fetch.py on the cron cycle, separately from
   state.json, so it is fetched separately and a stalled cron shows as a
   stale age rather than taking the whole board offline. */
let WIRE_ROWS = 3, WIRE_HOLD = 22000;
const WIRE_POLL = 300000;
let wireTimer = null;

/* Marquee is a single line scrolling continuously; fade is fixed rows that
   swap. Both are offered because which one is right depends on how tall the
   slot is — one row of a 12x1 strip can only marquee. */
function wireApplyOpts(o){
  if(!o) return;
  const rows = Math.max(1, Math.min(5, o.rows || 3));
  const hold = Math.max(6, Math.min(120, o.dwell || 22)) * 1000;
  const mode = o.mode === "marquee" ? "marquee" : "fade";
  if(rows === WIRE_ROWS && hold === WIRE_HOLD &&
     $("#wire").dataset.mode === mode) return;
  WIRE_ROWS = rows; WIRE_HOLD = hold;
  $("#wire").dataset.mode = mode;
  clearInterval(wireTimer);
  if(mode === "fade") wireTimer = setInterval(cycleWire, WIRE_HOLD);
  paintWire();
}
let wireItems = [], wireAt = 0, wireStamp = 0;

function since(ts){
  if(!ts) return "";
  const m = Math.round((Date.now()/1000 - ts) / 60);
  if(m < 1)  return "NOW";
  if(m < 60) return m + "M";
  const h = Math.round(m/60);
  return h < 24 ? h + "H" : Math.round(h/24) + "D";
}

function paintWire(){
  const box = $("#wireBody");
  if(!wireItems.length){
    box.innerHTML = `<div class="wnone">No headlines</div>`;
    $("#wireAge").textContent = "\u2014";
    return;
  }
  const rows = [];
  for(let i = 0; i < Math.min(WIRE_ROWS, wireItems.length); i++){
    const it = wireItems[(wireAt + i) % wireItems.length];
    rows.push(`<div class="wrow">
      <div class="wsrc">${esc(it.source||"")}</div>
      <div class="wtitle">${esc(it.title||"")}</div>
      <div class="wtime">${since(it.ts)}</div>
    </div>`);
  }
  box.innerHTML = rows.join("");
  $("#wireAge").textContent = since(wireStamp) || "\u2014";
}

function cycleWire(){
  if(wireItems.length <= WIRE_ROWS) return;
  const rows = document.querySelectorAll("#wireBody .wrow");
  rows.forEach(r => r.classList.add("out"));
  setTimeout(() => { wireAt = (wireAt + WIRE_ROWS) % wireItems.length;
                     paintWire(); }, 560);
}

async function loadWire(){
  try{
    const r = await fetch("data/news.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    wireItems = d.items || [];
    wireStamp = d.ts || 0;
    if(wireAt >= wireItems.length) wireAt = 0;
  }catch(e){
    /* Leave the last good headlines up. The age counter climbing past an
       hour is the tell that the cron job stopped. */
  }
  paintWire();
}

/* ---------------------------------------------------------------- radar
   Slippy-map maths done by hand. At zoom 7 one tile spans roughly 300km
   here, which is the right scale for watching a cell arrive from the west
   rather than for pinpointing a street. */
const RZ = 7, TILE = 256;
/* RainViewer's free tier tops out at zoom 7, which is ~900 m/px — at that
   scale the three tracks sit 90px apart and their labels collide. Tiles are
   drawn at zoom 7 and scaled up, trading a little sharpness for a frame the
   labels actually fit in. Radar echoes are soft blobs; they survive it. */
const RS = 2;
const HOME = [42.8142, -73.9396];              // Schenectady
const TRACKS = [
  ["ALBANY-SARATOGA", 42.9989, -73.7912, "#5fbf5a"],
  ["LEBANON VALLEY",  42.5834, -73.3979, "#5fbf5a"],
  ["FONDA",           42.9556, -74.3743, "#5fbf5a"],
];

function project(lat, lng, z){
  const n = Math.pow(2, z);
  const x = (lng + 180) / 360 * n;
  const r = lat * Math.PI / 180;
  const y = (1 - Math.log(Math.tan(r) + 1/Math.cos(r)) / Math.PI) / 2 * n;
  return [x * TILE, y * TILE];                  // world pixels
}

let radarFrames = [], radarHost = "", radarPos = 0, radarBuilt = "";
let geo = null;                     // tile window, shared by both layers

function tileWindow(){
  const box = $("#radar");
  const w = box.clientWidth, h = box.clientHeight;
  if (!w || !h) return null;
  const vw = w / RS, vh = h / RS;
  const [cx, cy] = project(HOME[0], HOME[1], RZ);
  const ox = cx - vw/2, oy = cy - vh/2;
  return {
    ox, oy,
    x0: Math.floor(ox / TILE), x1: Math.floor((ox + vw) / TILE),
    y0: Math.floor(oy / TILE), y1: Math.floor((oy + vh) / TILE),
  };
}

function place(img, x, y, g){
  img.style.left = (x*TILE - g.ox) + "px";
  img.style.top  = (y*TILE - g.oy) + "px";
  img.width = TILE; img.height = TILE;
}

/* The map stands on its own. It used to be built inside the radar routine,
   which meant a failed RainViewer fetch took the basemap and the track pins
   down with it — the panel just went black. */
function buildBase(){
  geo = tileWindow();
  if (!geo) return false;

  const base = $("#radarBase");
  base.innerHTML = "";
  base.style.transform = "scale(" + RS + ")";
  for (let x = geo.x0; x <= geo.x1; x++)
    for (let y = geo.y0; y <= geo.y1; y++){
      const img = new Image();
      img.src = `https://basemaps.cartocdn.com/dark_all/${RZ}/${x}/${y}.png`;
      place(img, x, y, geo);
      base.appendChild(img);
    }

  const pins = $("#radarPins"); pins.innerHTML = "";
  TRACKS.forEach(([name, lat, lng, ink]) => {
    const [px, py] = project(lat, lng, RZ);
    const el = document.createElement("div");
    el.className = "pin";
    el.style.left = ((px - geo.ox) * RS) + "px";
    el.style.top  = ((py - geo.oy) * RS) + "px";
    el.style.background = ink;
    el.innerHTML = `<b style="color:${ink}">${name.split("-")[0]}</b>`;
    pins.appendChild(el);
  });
  return true;
}

function buildEcho(){
  if (!geo && !buildBase()) return;
  const echo = $("#radarEcho");
  echo.innerHTML = "";
  echo.style.transform = "scale(" + RS + ")";
  radarFrames.forEach((f, i) => {
    for (let x = geo.x0; x <= geo.x1; x++)
      for (let y = geo.y0; y <= geo.y1; y++){
        const img = new Image();
        img.src = `${radarHost}${f.path}/${TILE}/${RZ}/${x}/${y}/4/1_1.png`;
        img.dataset.frame = i;
        place(img, x, y, geo);
        echo.appendChild(img);
      }
  });
  radarPos = radarFrames.length - 1;
  showFrame();
}

function showFrame(){
  const f = radarFrames[radarPos];
  if (!f) return;
  $("#radarEcho").querySelectorAll("img").forEach(im => {
    im.classList.toggle("on", +im.dataset.frame === radarPos);
  });
  const t = new Date(f.time * 1000);
  const hh = t.getHours() % 12 || 12;
  $("#radarTime").textContent =
    `${hh}:${String(t.getMinutes()).padStart(2,"0")} ${t.getHours()<12?"AM":"PM"}`;
}

let radarHold = 0;
function stepRadar(){
  const n = radarFrames.length;
  if (!n) return;
  // Sit on the newest frame for a beat before looping — that one is the
  // current picture, and it's the one worth looking at.
  if (radarPos === n - 1 && radarHold < RADAR_HOLD){ radarHold++; return; }
  radarHold = 0;
  radarPos = (radarPos + 1) % n;
  showFrame();
}
const RADAR_HOLD = 5;                 // ticks to linger on the latest frame
setInterval(stepRadar, 420);

function renderRadar(r){
  if (!geo) buildBase();                          // map first, always
  if (!r || !(r.frames||[]).length){
    $("#radarTime").textContent = "NO RADAR";
    return;
  }
  const sig = r.frames.map(f=>f.path).join("|");
  if (sig === radarBuilt) return;                 // same loop, nothing to do
  radarBuilt = sig;
  radarHost = r.host; radarFrames = r.frames;
  buildEcho();
}

/* Sky canvas: gradient plus whatever is falling. Same six skies as the
   Pixoo, so the two displays never disagree about the weather either. */
const SKIES = {
  clear:["#20548c","#7ba0d0"], cloudy:["#3f4653","#8b93a3"],
  rain:["#16222f","#43566b"],  snow:["#303849","#6b7492"],
  storms:["#1b1b2c","#484464"],night:["#080a22","#30244c"],
};
let sky="clear", tick=0, drops=[];
const cv=$("#sky"), cx=cv.getContext("2d");

function seedDrops(){
  drops = Array.from({length: sky==="storms"?90:56}, ()=>({
    x:Math.random(), y:Math.random(),
    s:(sky==="storms"?.010:.006)*(.5+Math.random()),
  }));
}
function paintSky(){
  const w=cv.width=cv.offsetWidth, h=cv.height=cv.offsetHeight;
  const p=SKIES[sky]||SKIES.clear;
  const g=cx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,p[0]); g.addColorStop(1,p[1]);
  cx.fillStyle=g; cx.fillRect(0,0,w,h);

  /* A clear sky with nothing in it is a void. Give it the thing that makes
     it clear — a low sun, or the moon after dark, breathing slightly. */
  if(sky==="clear"||sky==="night"){
    /* On a narrow card the top-right corner belongs to the wind and rain
       figures, so the sun moves down out of their way. */
    const tight = w < 520;
    const cxp = w*(tight?.72:.78), cyp = h*(tight?.66:.30);
    const br = Math.min(w,h)*(tight?.13:.17);
    const pulse=1+Math.sin(tick/90)*.02;
    const warm = sky==="clear";
    const halo=cx.createRadialGradient(cxp,cyp,0,cxp,cyp,br*3.2*pulse);
    halo.addColorStop(0, warm?"rgba(255,226,150,.34)":"rgba(200,214,255,.20)");
    halo.addColorStop(1, "rgba(0,0,0,0)");
    cx.fillStyle=halo; cx.beginPath(); cx.arc(cxp,cyp,br*3.2,0,7); cx.fill();
    cx.fillStyle = warm?"rgba(255,238,196,.92)":"rgba(226,232,250,.88)";
    cx.beginPath(); cx.arc(cxp,cyp,br*.52*pulse,0,7); cx.fill();
    if(!warm){                                  // bite a crescent out of it
      cx.globalCompositeOperation="destination-out";
      cx.beginPath(); cx.arc(cxp-br*.24,cyp-br*.14,br*.46,0,7); cx.fill();
      cx.globalCompositeOperation="source-over";
    }
  }
  if(sky==="rain"||sky==="storms"){
    cx.strokeStyle="rgba(178,208,245,.75)"; cx.lineWidth=Math.max(1,w/900);
    drops.forEach(d=>{
      const y=((d.y+tick*d.s)%1.2-.1)*h, x=d.x*w;
      cx.beginPath(); cx.moveTo(x,y); cx.lineTo(x+w*.004,y+h*.045); cx.stroke();
    });
  } else if(sky==="snow"){
    cx.fillStyle="rgba(255,255,255,.9)";
    drops.forEach(d=>{
      const y=((d.y+tick*d.s*.4)%1.2-.1)*h;
      const x=(d.x+Math.sin((y/h+d.x)*6)*.012)*w;
      cx.beginPath(); cx.arc(x,y,Math.max(1.2,w/620),0,7); cx.fill();
    });
  } else if(sky==="night"){
    drops.forEach((d,i)=>{
      const tw=(Math.sin(tick/22+i)+1)/2;
      cx.fillStyle="rgba(210,220,255,"+(.25+tw*.6)+")";
      cx.fillRect(d.x*w, d.y*h*.8+h*.1, Math.max(1.4,w/700), Math.max(1.4,w/700));
    });
  }
  tick++; requestAnimationFrame(paintSky);
}

async function load(){
  try{
    const r = await fetch("data/state.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const s = await r.json();
    dim(s.hour);
    renderFlag(s.dirt||{});
    renderTracks(s.dirt||{});
    renderWeather(s.weather||{});
    renderNascar(s.nascar);
    renderRadar(s.radar);
    renderServices(s.services);
    renderMedia(s.jellyfin);
    resolveSlots();   // now-playing may have just claimed or freed its slot
    const next = (s.weather||{}).sky || "clear";
    if(next!==sky){ sky=next; seedDrops(); }
  }catch(e){
    /* The board process writes this file. If it's missing, the board is down,
       which is worth saying plainly rather than leaving yesterday on screen. */
    $("#flag").className="offline";
    $("#flagWord").textContent="Board offline";
    $("#flagSub").textContent="No snapshot from the Pi";
  }
}
seedDrops(); paintSky(); buildBase(); load(); setInterval(load, POLL);
loadLayout(); setInterval(loadLayout, LAYOUT_POLL);
loadWire(); setInterval(loadWire, WIRE_POLL);
wireTimer = setInterval(cycleWire, WIRE_HOLD);
loadGallery(); setInterval(loadGallery, GALLERY_POLL);
</script>
</body>
</html>
