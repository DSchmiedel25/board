<script>
const ALL_MODULES = ["flag","racing","weather","radar","wire","media","services","pihole","gallery","clock","system","net"];
const $ = s => document.querySelector(s);
/* Headlines are the only strings on the board that come from outside the
   house. Six third-party feeds put an ampersand or a stray bracket in a
   title sooner or later, and one of them breaks the row it lands in. */
const esc = t => String(t == null ? "" : t)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

/* Scale the fixed surface to fill whatever screen it lands on. */
function fit(){
  const app = $("#app");
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  app.style.transform = "translate(-50%,-50%) scale(" + k + ")";
}
addEventListener("resize", fit);
addEventListener("orientationchange", () => setTimeout(fit, 120));
fit();

/* Dust hanging under the lights. Slow, sparse and warm — it should read as
   atmosphere you notice on the second look, not as falling snow. */
(function dustField(){
  const c=$("#dust"), x=c.getContext("2d");
  let bits=[];
  function seed(){
    c.width=1920; c.height=1080;
    bits=Array.from({length:80},()=>({
      x:Math.random()*c.width, y:Math.random()*c.height,
      r:Math.random()*1.7+.5, vx:.06+Math.random()*.22,
      a:.06+Math.random()*.22, p:Math.random()*7,
    }));
  }
  function paint(){
    x.clearRect(0,0,c.width,c.height);
    bits.forEach(b=>{
      b.x+=b.vx; b.p+=.006;
      if(b.x>c.width+4){b.x=-4; b.y=Math.random()*c.height;}
      const y=b.y+Math.sin(b.p)*7;
      x.fillStyle=`rgba(247,206,150,${b.a})`;
      x.beginPath(); x.arc(b.x,y,b.r,0,7); x.fill();
    });
    requestAnimationFrame(paint);
  }
  seed(); paint();
})();

/* Values roll to their new figure like a scoreboard wheel instead of
   blinking. Only worth doing where the number is big enough to watch. */
function roll(el, to, ms=700){
  const from = parseFloat(el.dataset.v);
  el.dataset.v = to;
  if (!isFinite(from) || from === to){ el.textContent = to; return; }
  const t0 = performance.now();
  (function step(now){
    const k = Math.min(1,(now-t0)/ms), e = 1-Math.pow(1-k,3);
    el.textContent = Math.round(from + (to-from)*e);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
const POLL = 15000;

/* Night dimming. A wall panel at full brightness at 2am is miserable, so the
   page follows the same schedule the Pixoo uses. */
function dim(hour){
  const night = hour >= 22 || hour < 6;
  document.body.style.filter = night ? "brightness(.42) saturate(.9)" : "brightness(1)";
}

const FLAG = {
  racing:["Racing tonight","racing"], rained:["Rained out","rained"],
  watch:["Watching weather","watch"], standby:["No racing tonight","standby"],
};

function renderFlag(dirt){
  const el = $("#flag");
  const status = dirt.status || "OK";
  let [word, cls] = FLAG[dirt.state] || ["Unknown","offline"];
  let sub = dirt.label || "";
  if (status === "OFFLINE" || status === "UNKNOWN"){
    word = "DirtCheck unreachable"; cls = "offline";
    sub = "Showing nothing rather than guessing";
  } else if (status === "STALE"){
    cls = "offline";                       /* never green on old data */
    sub = "Last known — source is not responding";
  }
  el.className = cls;
  $("#flagWord").textContent = word;
  $("#flagSub").textContent = sub;
}

const NAMES = {AS:["Albany-Saratoga","Malta NY"], LV:["Lebanon Valley","W Lebanon NY"],
               FON:["Fonda","Fonda NY"]};


/* --------------------------------------------------------------- racing
   Three dirt tracks and three NASCAR series in one card. They were separate
   panels because they come from separate sources, which is a reason to have
   two mapping modules, not two cards — from eight feet away it is one
   question: what's running and when. */
function renderRacing(dirt, nc){
  const body = $("#racingBody");
  dirt = dirt || {}; nc = nc || {};
  const dstatus = dirt.status || "OK";
  const dOk = !(dstatus === "OFFLINE" || dstatus === "UNKNOWN") && (dirt.rows||[]).length;
  const nOk = (nc.rows||[]).length;

  if(!dOk && !nOk){
    body.innerHTML = `<div class="down"><div><b>No data</b>Neither source is answering</div></div>`;
    $("#racingAge").textContent = ""; return;
  }
  $("#racingAge").innerHTML = dstatus === "STALE" ? `<span class="pill">Stale</span>` : "";

  const LONG = {CUP:"Cup Series", XFN:"Xfinity", TRK:"Trucks"};
  let out = `<div class="rgroup"><span>Dirt</span></div>`;

  if(dOk){
    out += dirt.rows.slice(0,3).map(r => {
      const [name, town] = NAMES[r.code] || [r.code, ""];
      const live = r.state && r.state !== "dark";
      return `<div class="rrow ${live?"live":"dark"}">
        <div class="bar"></div>
        <div class="who"><div class="nm">${esc(name)}</div>
             <div class="sub">${esc(town)}</div></div>
        <div class="when"><div class="w1">${esc(r.when||"—")}</div>
             <div class="w2">${live?"GREEN":"DARK"}${
               r.prob==null?"":" &middot; "+r.prob+"% RAIN"}</div></div>
      </div>`;
    }).join("");
  }else{
    out += `<div class="rrow dark"><div class="bar"></div>
      <div class="who"><div class="sub">DirtCheck not answering</div></div></div>`;
  }

  out += `<div class="rgroup"><span>NASCAR</span></div>`;

  if(nOk){
    out += nc.rows.slice(0,3).map(r => {
      const live = !!r.live;
      const when = live ? "RACING" : (r.time || r.when || "");
      const day  = r.date || (r.when || "").split(" ")[0] || "";
      return `<div class="rrow ${live?"live":"dark"}">
        <div class="bar"></div>
        <div class="who"><div class="nm">${esc(LONG[r.label]||r.label)}</div>
             <div class="sub">${esc(r.venue||"")}</div></div>
        <div class="when"><div class="w1">${esc(when)}</div>
             <div class="w2">${esc(day)}</div></div>
        ${r.net?`<div class="net">${esc(r.net)}</div>`:""}
      </div>`;
    }).join("");
  }else{
    /* Off-season is not a fault. Saying "no data" here for three months
       every winter trains you to ignore the card. */
    out += `<div class="rrow dark"><div class="bar"></div>
      <div class="who"><div class="sub">Season over &mdash; next schedule in February</div></div></div>`;
  }
  body.innerHTML = out;
}

function renderWeather(wx){
  const body = $("#wxBody"), status = wx.status || "OK";
  if (status === "OFFLINE" || status === "UNKNOWN" || wx.temp == null){
    $("#wxWord").textContent = "Weather";
    body.innerHTML = `<div class="down"><div><b>No data</b>Can't reach Open-Meteo</div></div>`;
    return;
  }
  const w = (wx.sky||"clear");
  $("#wxWord").textContent = w.charAt(0).toUpperCase()+w.slice(1);

  const live = body.querySelector(".wxtemp");
  if (live){                                   // already built — just move it
    roll(live, wx.temp);
    body.querySelector(".wxsub").innerHTML =
      `Feels ${wx.feels}&deg;<br>Wind ${wx.wind} mph<br>${wx.rain}% rain`;
    return;
  }
  body.innerHTML = `
    <div class="wxmain">
      <div class="tempwrap"><div class="wxtemp" data-v="${wx.temp}">${wx.temp}</div>
        <div class="wxdeg">&deg;F</div></div>
      <div class="wxsub">Feels ${wx.feels}&deg;<br>Wind ${wx.wind} mph<br>${wx.rain}% rain</div>
    </div>
    <div class="days">${(wx.days||[]).map(d=>`
      <div class="day"><div class="n">${d[0]}</div>
        <div class="hi">${d[1]}&deg;</div><div class="lo">${d[2]}&deg;</div></div>`).join("")}
    </div>`;
}

function fieldRows(fl){
  return fl.rows.map(r=>`<div class="frow">
      <span class="pos">${r[0]}</span>
      <span class="car">${r[2] ? "#" + r[2] : ""}</span>
      <span class="dvr">${r[1]}</span>
    </div>`).join("");
}


function renderServices(svc){
  const box = $("#svcBody");
  if (!box) return;
  if (!svc || svc.offline || !(svc.rows||[]).length){
    box.innerHTML = `<div class="svcnone">Uptime Kuma unreachable</div>`;
    $("#svcHead").textContent = "Services";
    $("#svcHead").className = "shead bad";
    return;
  }
  const bad = (svc.down||[]).length;
  $("#svcHead").textContent = bad
    ? `${bad} down` : `All ${svc.total} up`;
  $("#svcHead").className = "shead " + (bad ? "bad" : "ok");
  box.innerHTML = svc.rows.map(r => `
    <div class="svc ${r.up?"up":"dn"}">
      <span class="sdot"></span>
      <span class="sname">${r.name}</span>
      <span class="spct">${r.uptime!=null ? r.uptime.toFixed(1)+"%" : ""}</span>
    </div>`).join("");
}

function renderMedia(jf){
  const on = jf && jf.playing;
  document.body.classList.toggle("no-media", !on);
  // The bottom strip is one slot: what's playing, or service health when
  // nothing is. No new real estate needed for either.
  $("#services").hidden = on;
  if (!on) return;

  // Everyone watching, not just the one the Pixoo picked. Two streams sit
  // side by side; beyond that they stack as compact rows, because a wall
  // panel should never hide the fact that somebody else is watching.
  const all = (jf.all && jf.all.length) ? jf.all : [jf];
  const card = document.getElementById("media");
  card.dataset.n = Math.min(all.length, 3);

  /* Hero vs strip is read from the card's own rendered box, not from which
     modules share its slot — a slot's shape can change from the layout
     editor without a matching code change here. One viewer, in a box that
     isn't the classic wide bar, gets the poster; two+ viewers always get
     the strip, since one hero poster can't speak for two different shows.
     1.8 sits between a true poster (~0.7) and the old minimum bar (3.0) —
     comfortably past the point a poster still fits above the text. */
  const box = card.getBoundingClientRect();
  const hero = all.length === 1 && box.height > 0 && (box.width / box.height) < 1.8;
  card.dataset.mode = hero ? "hero" : "strip";

  /* Cache-bust on the title, not the clock: a new bust every poll would
     refetch the same image four times a minute and restart its animation. */
  const key = encodeURIComponent((jf.title||"") + (jf.sub||""));
  const src = jf.poster ? `${jf.poster}?k=${key}` : "";
  const back = $("#backdrop");
  back.style.backgroundImage = src ? `url("${src}")` : "none";

  if(hero){
    const v = all[0];
    $("#mediaBody").innerHTML = `
      <div class="hero">
        ${src ? `<img class="heroArt" src="${src}" alt="" decoding="async"
             onerror="this.setAttribute('data-empty','')">` : ""}
        <div class="heroScrim"></div>
        <div class="heroInfo">
          <div class="hwho">${v.paused ? "Paused &middot; " : "Watching &middot; "}${(v.user||"").toUpperCase()}</div>
          <div class="htitle">${v.title||""}</div>
          <div class="hsub">${v.sub||""}</div>
          <div class="prog"><i style="width:${v.pct||0}%"></i></div>
        </div>
      </div>`;
    return;
  }

  const cells = all.map((v, i) => `
    <div class="stream">
      ${i === 0 && src
        ? `<img class="art" src="${src}" alt="" decoding="async"
             onerror="this.setAttribute('data-empty','')">`
        : ""}
      <div class="sinfo">
        <div class="swho">${(v.user||"").toUpperCase()}${v.paused?" &middot; PAUSED":""}</div>
        <div class="stitle">${v.title||""}</div>
        <div class="ssub">${v.sub||""}</div>
        <div class="prog"><i style="width:${v.pct||0}%"></i></div>
      </div>
    </div>`).join("");

  $("#mediaBody").innerHTML = `<div class="streams">${cells}</div>`;
}

/* -------------------------------------------------------------- gallery
   Photos, GIFs-turned-MP4 and clips, from wall/index.json. Two layers swap
   so the outgoing item is still on screen while the incoming one loads —
   a single element flashes the background between items.

   Video runs its own length rather than the dwell slider: cutting a clip at
   an arbitrary 8 seconds looks like a fault. The dwell applies to stills. */
const GALLERY_POLL = 60000;
let glItems = [], glOrder = [], glAt = 0, glLayer = 0, glTimer = null,
    glSig = "", glOpts = {dwell: 8, order: "shuffle", show: ["still","video"], fit: "contain"};

function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function glBuildOrder(){
  const want = glOpts.show || ["still","video"];
  const pool = glItems
    .map((it, i) => [it, i])
    .filter(([it]) => want.includes(it.type))
    .map(([, i]) => i);
  glOrder = glOpts.order === "sequence" ? pool : shuffle(pool.slice());
  glAt = 0;
}

/* The board runs two requestAnimationFrame canvas loops. Adding H.264 decode
   on top is where a Pi 4 starts dropping frames, so the dust layer stands
   down while a clip is playing and comes back when it ends. */
function glDust(off){
  const d = document.getElementById("dust");
  if(d) d.style.display = off ? "none" : "";
}

function glNext(){
  clearTimeout(glTimer);
  const host = $("#gallery");
  if(!glOrder.length){
    $("#glA").innerHTML = `<div class="glnone">Nothing uploaded yet</div>`;
    $("#glA").classList.add("on"); $("#glB").classList.remove("on");
    glDust(false);
    return;
  }
  const it = glItems[glOrder[glAt % glOrder.length]];
  glAt = (glAt + 1) % glOrder.length;
  if(glAt === 0 && glOpts.order !== "sequence") glBuildOrder();   // reshuffle each pass

  const next = glLayer ? $("#glA") : $("#glB");
  const cur  = glLayer ? $("#glB") : $("#glA");
  const url = "data/wall/" + it.file;
  let hold = (glOpts.dwell || 8) * 1000;

  if(it.type === "video"){
    glDust(true);
    next.innerHTML = `<video src="${url}" autoplay muted loop playsinline></video>`;
    // Its own duration, floored so a one-second GIF doesn't strobe.
    hold = Math.max(4, it.dur || 8) * 1000;
  }else{
    glDust(false);
    next.innerHTML = `<div class="back" style="background-image:url('${url}')"></div>
                      <img src="${url}" alt="" decoding="async">`;
  }
  /* Per-item framing, applied identically to how the editor previews it —
     that identity is the only reason the preview can be trusted. "auto"
     defers to the gallery's own Framing setting. */
  const fr = it.frame || {};
  const el = next.querySelector("img,video");
  if(el){
    const fit = (!fr.fit || fr.fit === "auto") ? (glOpts.fit || "contain") : fr.fit;
    el.style.objectFit = fit;
    if(fr.x != null) el.style.objectPosition = fr.x + "% " + fr.y + "%";
    if(fr.zoom && fr.zoom !== 1){
      el.style.transform = "scale(" + fr.zoom + ")";
      el.style.transformOrigin = (fr.x ?? 50) + "% " + (fr.y ?? 50) + "%";
    }
    // A per-item fit overrides the slot-wide CSS rule.
    next.dataset.fit = fit;
  }
  host.dataset.fit = glOpts.fit || "contain";
  next.classList.add("on"); cur.classList.remove("on");
  glLayer = glLayer ? 0 : 1;
  // Free the decoder on the layer that just left, or a long rotation ends up
  // holding every clip it has ever played.
  setTimeout(() => { if(!cur.classList.contains("on")) cur.innerHTML = ""; }, 1000);
  glTimer = setTimeout(glNext, hold);
}

async function loadGallery(){
  try{
    const r = await fetch("data/wall/index.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    const sig = JSON.stringify((d.items||[]).map(i => i.file));
    if(sig !== glSig){ glSig = sig; glItems = d.items || []; glBuildOrder();
                       if(!glTimer) glNext(); }
  }catch(e){
    if(!glItems.length){ glBuildOrder(); glNext(); }
  }
}

/* Settings arrive with the layout, so a change to the dwell slider restarts
   the rotation on the next poll rather than waiting out the old timer. */
function glApplyOpts(o){
  if(!o) return;
  const before = JSON.stringify(glOpts);
  glOpts = Object.assign({}, glOpts, o);
  if(JSON.stringify(glOpts) !== before){ glBuildOrder(); glNext(); }
}

/* ----------------------------------------------------------------- wire
   news.json is written by fetch.py on the cron cycle, separately from
   state.json, so it is fetched separately and a stalled cron shows as a
   stale age rather than taking the whole board offline. */
let WIRE_ROWS = 3, WIRE_HOLD = 22000;
const WIRE_POLL = 300000;
let wireTimer = null;
let wireItems = [], wireAt = 0, wireStamp = 0;

/* Marquee is a single line scrolling continuously; fade is fixed rows that
   swap. Both are offered because which is right depends on how tall the slot
   is — one row of a 12x1 strip can only marquee. */
function wireApplyOpts(o){
  if(!o) return;
  const rows = Math.max(1, Math.min(5, o.rows || 3));
  const hold = Math.max(6, Math.min(120, o.dwell || 22)) * 1000;
  const mode = o.mode === "marquee" ? "marquee" : "fade";
  if(rows === WIRE_ROWS && hold === WIRE_HOLD &&
     $("#wire").dataset.mode === mode) return;
  WIRE_ROWS = rows; WIRE_HOLD = hold;
  $("#wire").dataset.mode = mode;
  clearInterval(wireTimer);
  if(mode === "fade") wireTimer = setInterval(cycleWire, WIRE_HOLD);
  paintWire();
}

function since(ts){
  if(!ts) return "";
  const m = Math.round((Date.now()/1000 - ts) / 60);
  if(m < 1)  return "NOW";
  if(m < 60) return m + "M";
  const h = Math.round(m/60);
  return h < 24 ? h + "H" : Math.round(h/24) + "D";
}

function paintWire(){
  const box = $("#wireBody");
  if(!wireItems.length){
    box.innerHTML = `<div class="wnone">No headlines</div>`;
    $("#wireAge").textContent = "\u2014";
    return;
  }
  const rows = [];
  for(let i = 0; i < Math.min(WIRE_ROWS, wireItems.length); i++){
    const it = wireItems[(wireAt + i) % wireItems.length];
    rows.push(`<div class="wrow">
      <div class="wsrc">${esc(it.source||"")}</div>
      <div class="wtitle">${esc(it.title||"")}</div>
      <div class="wtime">${since(it.ts)}</div>
    </div>`);
  }
  box.innerHTML = rows.join("");
  $("#wireAge").textContent = since(wireStamp) || "\u2014";
}

function cycleWire(){
  if(wireItems.length <= WIRE_ROWS) return;
  const rows = document.querySelectorAll("#wireBody .wrow");
  rows.forEach(r => r.classList.add("out"));
  setTimeout(() => { wireAt = (wireAt + WIRE_ROWS) % wireItems.length;
                     paintWire(); }, 560);
}

async function loadWire(){
  try{
    const r = await fetch("data/news.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    wireItems = d.items || [];
    wireStamp = d.ts || 0;
    if(wireAt >= wireItems.length) wireAt = 0;
  }catch(e){
    /* Leave the last good headlines up. The age counter climbing past an
       hour is the tell that the cron job stopped. */
  }
  paintWire();
}

/* --------------------------------------------------------------- pihole
   Reads state.json's own pihole key. pihole.py returns nothing at all rather
   than partial data on a failure, so there is no half-filled case to render:
   either real numbers, last-known-good flagged stale, or offline. */
function nfmt(n){
  n = +n || 0;
  if(n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,"") + "M";
  if(n >= 10000)   return Math.round(n/1000) + "K";
  if(n >= 1000)    return (n/1000).toFixed(1).replace(/\.0$/,"") + "K";
  return String(n);
}

function renderPihole(ph){
  const body = $("#phBody"), card = $("#pihole");
  ph = ph || {};
  if(ph.offline || (!ph.total && !(ph.history||[]).length)){
    card.className = "card off";
    body.innerHTML = `<div class="phlab"><span>Pi-hole</span></div>
      <div class="phtop"><div class="d">Not answering</div></div>`;
    return;
  }
  card.className = "card";
  const pct = (ph.pct != null) ? ph.pct
            : (ph.total ? ph.blocked / ph.total * 100 : 0);

  /* The history is [total, blocked] pairs. Drawn as blocked-over-total so
     the bar height is traffic and the fill is what was stopped — one shape
     answering "busy?" and "blocking?" at once. */
  const hist = (ph.history || []).slice(-24);
  const peak = Math.max(1, ...hist.map(h => h[0] || 0));
  const spark = hist.length
    ? `<div class="phspark">${hist.map(([t, b]) =>
        `<i style="height:${Math.max(2, (t/peak)*100)}%"><b style="height:${
           t ? Math.min(100,(b/t)*100) : 0}%"></b></i>`).join("")}</div>`
    : "";

  const state = ph.enabled === false
    ? `<span class="phpause">Paused</span>`
    : (ph.stale ? `<span class="phstale">Last known</span>` : `<span>Today</span>`);

  body.innerHTML = `
    <div class="phlab"><span>Pi-hole</span>${state}</div>
    <div class="phpct">${pct.toFixed(1)}<small>%</small></div>
    <div class="phnums">
      <div class="phn"><div class="v">${nfmt(ph.total)}</div><div class="k">Queries</div></div>
      <div class="phn"><div class="v">${nfmt(ph.blocked)}</div><div class="k">Blocked</div></div>
    </div>
    ${spark}
    <div class="phtop">${ph.top
      ? `<div class="k" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;
           letter-spacing:.15em;color:var(--slate);text-transform:uppercase">Top blocked</div>
         <div class="d">${esc(ph.top)}</div>` : ""}</div>`;
}

/* --------------------------------------------------------------- alerts
   NWS active alerts, fetched server-side by fetch.py. Separate poll from
   state.json: alerts change on their own schedule and a stalled board
   process shouldn't take the band down with it.

   Deliberately not a takeover of the flag strip. A Winter Weather Advisory
   is not more important than knowing whether the track is running, and a
   band that hijacks the biggest element for routine advisories gets ignored
   exactly when it matters. */
const ALERT_POLL = 120000;
let alertSig = "";

function alertClass(a){
  const s = (a.severity || "").toLowerCase();
  if(s === "extreme") return "extreme";
  if(s === "severe")  return "severe";
  return "";                            // amber, the default
}

function untilText(iso){
  if(!iso) return "";
  const t = Date.parse(iso);
  if(isNaN(t)) return "";
  const mins = Math.round((t - Date.now()) / 60000);
  if(mins <= 0)   return "ENDING";
  if(mins < 90)   return "UNTIL " + mins + "M";
  const hrs = Math.round(mins / 60);
  if(hrs < 36)    return "UNTIL " + hrs + "H";
  return "UNTIL " + new Date(t).toLocaleDateString(undefined,
    {weekday:"short"}).toUpperCase();
}

function renderAlerts(doc){
  const el = $("#wxAlert");
  const list = (doc && doc.alerts) || [];
  const sig = JSON.stringify(list.map(a => [a.event, a.ends])) + (doc && doc.ok);
  if(sig === alertSig) return;
  alertSig = sig;

  if(!list.length){ el.hidden = true; return; }
  const a = list[0];                    // fetch.py already sorted worst first
  el.hidden = false;
  /* A failed fetch keeps the last known alerts rather than clearing the band
     mid-storm, but they stop being presented as current. */
  el.className = (doc.ok === false) ? "stale" : alertClass(a);
  el.innerHTML =
    `<span class="ev">${esc(a.event)}</span>` +
    (list.length > 1 ? `<span class="more">+${list.length - 1}</span>` : "") +
    `<span class="til">${doc.ok === false ? "LAST KNOWN" : esc(untilText(a.ends))}</span>`;
}

async function loadAlerts(){
  try{
    const r = await fetch("data/alerts.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    renderAlerts(await r.json());
  }catch(e){ /* no file yet: leave the band hidden rather than inventing one */ }
}

/* ---------------------------------------------------------------- clock
   Ticks locally rather than from state.json, so it stays right even when
   nothing is being fetched. */
let clkOpts = {fmt:"12", secs:"off", date:"long"};
let clkTimer = null, clkRate = 0, clkLastSec = -1;

function clockApplyOpts(o){
  clkOpts = Object.assign({fmt:"12", secs:"off", date:"long"}, o || {});
  const el = $("#clock");
  if(el){
    el.dataset.secs = clkOpts.secs;
    el.dataset.date = clkOpts.date;
  }
  armClock();
}

/* One timer, two rates. Seconds need 1s; without them 10s is plenty and
   costs a tenth of the wakeups on a Pi that is also decoding video. */
function armClock(){
  const want = (clkOpts.secs === "on") ? 1000 : 10000;
  if(clkTimer && clkRate === want) return;
  clearInterval(clkTimer);
  clkRate = want;
  clkTimer = setInterval(tickClock, want);
  tickClock();
}

function tickClock(){
  const t = new Date();
  const h24 = t.getHours(), mm = String(t.getMinutes()).padStart(2,"0");

  // Corner fallback is always 12-hour and short-form: it is small, and it is
  // not the thing anyone configured.
  const c = $("#cornerclock");
  if(c){
    c.querySelector(".t").textContent = (h24 % 12 || 12) + ":" + mm;
    c.querySelector(".d").textContent = t.toLocaleDateString(undefined,
      {weekday:"short", month:"short", day:"numeric"});
  }

  const mt = $("#clkT");
  if(!mt) return;
  const h12 = clkOpts.fmt === "24";
  mt.textContent = (h12 ? String(h24).padStart(2,"0") : (h24 % 12 || 12)) + ":" + mm;
  $("#clkM").textContent = h12 ? "" : (h24 < 12 ? "AM" : "PM");

  const d = $("#clkD");
  if(clkOpts.date === "long"){
    d.textContent = t.toLocaleDateString(undefined,
      {weekday:"long", month:"long", day:"numeric"});
  }else{
    d.textContent = t.toLocaleDateString(undefined,
      {weekday:"short", month:"short", day:"numeric"});
  }

  if(clkOpts.secs === "on"){
    const s = t.getSeconds();
    // Kill the transition for the 59->0 step only, so the bar snaps to empty
    // instead of sliding backwards across the whole card.
    const wrap = s < clkLastSec;
    $("#clock").dataset.wrap = wrap ? "1" : "";
    $("#clkS").style.width = (s / 60 * 100).toFixed(1) + "%";
    clkLastSec = s;
  }
}

/* ---------------------------------------------------------------- stale
   Two different failures look identical on a wall: the data stopped, or the
   machine did. The old code caught only the first — a fetch error meant
   board.py was down. If the Pi loses power the browser holds the last render
   indefinitely and the board confidently shows Friday's forecast on Sunday.

   So: track the last successful poll here. If nothing has landed for two
   minutes, say so on the board itself. Anything that stops the chain —
   power, network, nginx, the cron job — ends up visible. */
const STALE_AFTER = 120000;
let lastGood = Date.now(), staleWasOn = false;

function checkStale(){
  const age = Date.now() - lastGood;
  const on = age > STALE_AFTER;
  if(on === staleWasOn) return;
  staleWasOn = on;
  const el = $("#stale");
  el.hidden = !on;
  if(on){
    const mins = Math.round(age/60000);
    el.textContent = "Board data " + mins + " min old — not updating";
  }
}

/* -------------------------------------------------------- health cards
   Pi health and Network render from one payload (state.sysnet) into two
   cards. Kept as one function pair rather than two independent renderers
   because the verdict is computed over both halves on the Pi — a full disk
   and a dead gateway are the same kind of news — and splitting the render
   would mean deciding twice which card owns which note. */

function human(n, unit){
  /* Bits per second and bytes both want the same treatment, and a wall is
     not the place for six significant figures. */
  const u = unit || ["", "K", "M", "G", "T"];
  let i = 0, v = Number(n) || 0;
  while(v >= 1000 && i < u.length - 1){ v /= 1000; i++; }
  // parseFloat, not toFixed: 98.0Kb next to 432Kb looks like a different
  // kind of number rather than the same one a bit smaller.
  return (v >= 100 || i === 0 ? Math.round(v) : parseFloat(v.toFixed(1))) + u[i];
}

function dur(sec){
  const s = Math.max(0, Math.floor(Number(sec) || 0));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600);
  if(d >= 1) return d + "d " + h + "h";
  const m = Math.floor(s % 3600 / 60);
  return h >= 1 ? h + "h " + m + "m" : m + "m";
}

/* One reading: value, label, and optionally a fullness bar with its own
   warn/bad shading. Thresholds live here rather than in CSS so the bar and
   the number can never disagree about what counts as bad. */
function stat(value, label, pct, warn, bad){
  const has = pct !== undefined && pct !== null && isFinite(pct);
  let cls = "hstat";
  if(has && bad !== undefined && pct >= bad) cls += " bad";
  else if(has && warn !== undefined && pct >= warn) cls += " warn";
  return '<div class="' + cls + '"><b>' + value + '</b><span>' + label + '</span>'
       + (has ? '<div class="hbar"><i style="width:'
                + Math.max(0, Math.min(100, pct)).toFixed(0) + '%"></i></div>' : '')
       + '</div>';
}

function healthHead(card, wordEl, noteEl, d, okWord){
  /* Anything that isn't a level we recognise is "unknown". An absent
     state.sysnet — old board.py, or the service not restarted yet — used to
     fall through to the green branch and claim the Pi was healthy on the
     strength of no evidence whatsoever. */
  const known = ["ok", "warn", "bad"];
  const lvl = known.includes(d && d.level) ? d.level : "unknown";
  card.dataset.level = lvl;
  const notes = (d && d.notes) || [];
  /* The verdict is the headline. When it's bad the first note becomes the
     word itself, because "BAD" tells you nothing you can act on. */
  if(lvl === "unknown"){
    wordEl.textContent = "No data";
    noteEl.textContent = "";
  }else if(notes.length){
    wordEl.textContent = notes[0];
    noteEl.textContent = notes.slice(1).join(" \u00b7 ");
  }else{
    wordEl.textContent = okWord;
    noteEl.textContent = "";
  }
}

function renderSystem(d){
  const card = $("#system");
  if(!card) return;
  d = d || {};
  /* Split the verdict: the Pi card should not lead with a network problem,
     and vice versa, or both cards say the same thing and one of them is
     lying about whose fault it is. */
  const netWords = /gateway|internet|tailscale|down$|loss/i;
  const mine = (d.notes || []).filter(n => !netWords.test(n));
  /* Evidence is checked per card, not per document. sysnet computes one
     verdict over both halves, so a payload with temperatures but no ping
     result would otherwise hand the network card a green light it never
     earned — and vice versa. */
  const sysSeen = d.temp_c != null || (d.mem || {}).pct != null
                  || (d.disks || []).length > 0;
  healthHead(card, $("#sysWord"), $("#sysNote"),
             {level: mine.length ? d.level : (sysSeen ? "ok" : null), notes: mine},
             "Pi healthy");

  $("#sysUp").textContent = d.uptime_s != null ? "UP " + dur(d.uptime_s) : "";

  const out = [];
  if(d.temp_c != null){
    /* Scaled 30-85C, not 0-85: a Pi idling at 48C is not "over half way to
       melting", and a bar that says it is trains you to ignore the bar. 85 is
       the hard throttle, 30 is about as cool as this thing is ever seen. */
    const tp = v => (v - 30) / 55 * 100;
    out.push(stat(d.temp_c + "\u00b0", "CPU TEMP", tp(d.temp_c), tp(70), tp(80)));
  }
  if(d.cpu_pct != null)
    out.push(stat(Math.round(d.cpu_pct) + "%", "CPU", d.cpu_pct, 80, 92));
  else if(d.load)
    out.push(stat(d.load[0].toFixed(2), "LOAD 1M",
                  d.cores ? d.load[0] / d.cores * 100 : null, 85, 110));
  if(d.mem)
    out.push(stat(Math.round(d.mem.pct) + "%", "MEMORY", d.mem.pct, 85, 94));
  (d.disks || []).forEach(k => {
    /* "/" is the boot disk to a human, not a path. */
    const name = k.mount === "/" ? "BOOT DISK"
               : k.mount.replace(/^.*\//, "").toUpperCase() || k.mount;
    out.push(stat(k.free_gb >= 100 ? Math.round(k.free_gb) + "G" : k.free_gb + "G",
                  name + " FREE", k.pct, 85, 93));
  });
  $("#sysBody").innerHTML = out.join("");
}

function renderNet(d){
  const card = $("#net");
  if(!card) return;
  d = d || {};
  const n = d.net || {};
  const netWords = /gateway|internet|tailscale|down$|loss/i;
  const mine = (d.notes || []).filter(n2 => netWords.test(n2));
  const netSeen = (n.gw || {}).loss != null || (n.wan || {}).loss != null;
  healthHead(card, $("#netWord"), $("#netNote"),
             {level: mine.length ? d.level : (netSeen ? "ok" : null), notes: mine},
             "Network up");

  const bits = [];
  if(n.iface) bits.push(n.iface);
  if(n.speed_mbps) bits.push(n.speed_mbps >= 1000
    ? (n.speed_mbps / 1000) + "G" : n.speed_mbps + "M");
  else if(n.wifi) bits.push("WI-FI");
  $("#netLink").textContent = bits.join(" \u00b7 ");

  const out = [];
  const gw = n.gw || {}, wan = n.wan || {};
  if(gw.ms != null) out.push(stat(gw.ms + "ms", "GATEWAY"));
  else if(gw.loss != null) out.push(stat("\u2014", "GATEWAY"));
  if(wan.ms != null) out.push(stat(wan.ms + "ms", "INTERNET",
                                   wan.ms / 250 * 100, 48, 100));
  else if(wan.loss != null) out.push(stat("\u2014", "INTERNET", 100, 48, 100));
  if(n.rx_bps != null) out.push(stat(human(n.rx_bps) + "b", "DOWN NOW"));
  if(n.tx_bps != null) out.push(stat(human(n.tx_bps) + "b", "UP NOW"));
  const ts = n.tailscale;
  if(ts) out.push(stat(ts.up ? ts.online + "/" + ts.peers : "OFF", "TAILSCALE"));
  $("#netBody").innerHTML = out.join("");
}

/* ---------------------------------------------------------------- slots
   layout.json is a list of rectangles, each holding an ordered list of
   modules. Slots never overlap — the server refuses it — so exactly one
   module is visible per slot and there is no priority arithmetic here.

     single / takeover   first module with something to show, and it keeps
                         the slot until it hasn't. List order is priority.
     rotate              cycle the ones with something to show, dwell each.

   Emptiness is per module: an off-season card or an idle Jellyfin is skipped
   rather than rotated in blank. */
const LAYOUT_POLL = 10000;
let layoutSig = "", slots = [], slotTimers = {}, slotAt = {};

function hasContent(key){
  if(key === "media")   return !document.body.classList.contains("no-media");
  if(key === "gallery") return glItems.length > 0;
  return true;                     // the rest always have something to say
}

function liveModules(slot){
  const live = slot.modules.filter(hasContent);
  // Everything empty: keep the first so the slot shows its own empty state
  // rather than leaving a hole in the grid.
  return live.length ? live : slot.modules.slice(0, 1);
}

function showInSlot(slot, key){
  slot.modules.forEach(k => {
    const el = document.getElementById(k);
    if(el) el.dataset.hide = (k === key) ? "" : "1";
  });
}

function tickSlot(slot){
  const live = liveModules(slot);
  const at = (slotAt[slot.id] || 0) % live.length;
  showInSlot(slot, live[at]);
  slotAt[slot.id] = (at + 1) % live.length;
}

function runSlots(){
  slots.forEach(slot => {
    clearInterval(slotTimers[slot.id]);
    if(slot.mode === "rotate" && slot.modules.length > 1){
      tickSlot(slot);
      slotTimers[slot.id] = setInterval(() => tickSlot(slot), slot.dwell * 1000);
    }else{
      showInSlot(slot, liveModules(slot)[0]);
    }
  });
}

/* Called whenever content appears or disappears — a movie starting has to
   claim its slot without waiting for the next layout poll. */
function refreshSlots(){
  slots.forEach(slot => {
    if(slot.mode === "rotate" && slot.modules.length > 1) return;   // timer owns it
    showInSlot(slot, liveModules(slot)[0]);
  });
}

function applyLayout(doc){
  if(!doc || !Array.isArray(doc.slots)) return;
  const sig = JSON.stringify([doc.slots, doc.opts, doc.gap]);
  if(sig === layoutSig) return;
  layoutSig = sig;

  const app = document.getElementById("app");
  if(typeof doc.gap === "number") app.style.setProperty("--gap", doc.gap + "px");

  // Hide everything first, then let the slots claim their own. A module
  // dragged to "not shown" has no slot to switch it off, so this is what
  // turns it off.
  ALL_MODULES.forEach(k => {
    const el = document.getElementById(k);
    if(!el) return;
    el.dataset.hide = "1";
    // Text size and accent color, independent of slot placement — applied
    // here rather than only for modules currently in a slot, so both are
    // already correct if one gets dragged into a slot later without a
    // full page reload.
    const pct = doc.opts?.[k]?.scale;
    el.style.setProperty("--textScale", typeof pct === "number" ? pct / 100 : 1);
    const rg = doc.opts?.[k]?.rowgap;
    el.style.setProperty("--rowGap", typeof rg === "number" ? rg / 100 : 1);
    const accent = doc.opts?.[k]?.accent;
    if(accent) el.style.setProperty("--accent", accent);
    else el.style.removeProperty("--accent");   // falls back to --sodium in CSS
  });

  slots = doc.slots;
  slots.forEach(slot => {
    slot.modules.forEach(k => {
      const el = document.getElementById(k);
      if(!el) return;
      el.style.gridColumn = slot.col + " / span " + slot.w;
      el.style.gridRow    = slot.row + " / span " + slot.h;
    });
  });

  // The corner clock stands down only if the module actually holds a slot.
  // "not shown" leaves it in doc.off, not in a slot, so the fallback stays.
  app.dataset.clockslot =
    slots.some(s => (s.modules || []).includes("clock")) ? "1" : "";

  if(doc.opts){
    glApplyOpts(doc.opts.gallery);
    wireApplyOpts(doc.opts.wire);
    clockApplyOpts(doc.opts.clock);
  }
  runSlots();
}

async function loadLayout(){
  try{
    const r = await fetch("data/layout.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    applyLayout(await r.json());
  }catch(e){ /* stylesheet fallback spans stand */ }
}

/* ---------------------------------------------------------------- radar
   Slippy-map maths done by hand. At zoom 7 one tile spans roughly 300km
   here, which is the right scale for watching a cell arrive from the west
   rather than for pinpointing a street. */
const RZ = 7, TILE = 256;
/* RainViewer's free tier tops out at zoom 7, which is ~900 m/px — at that
   scale the three tracks sit 90px apart and their labels collide. Tiles are
   drawn at zoom 7 and scaled up, trading a little sharpness for a frame the
   labels actually fit in. Radar echoes are soft blobs; they survive it. */
const RS = 2;
const HOME = [42.8142, -73.9396];              // Schenectady
const TRACKS = [
  ["ALBANY-SARATOGA", 42.9989, -73.7912, "#5fbf5a"],
  ["LEBANON VALLEY",  42.5834, -73.3979, "#5fbf5a"],
  ["FONDA",           42.9556, -74.3743, "#5fbf5a"],
];

function project(lat, lng, z){
  const n = Math.pow(2, z);
  const x = (lng + 180) / 360 * n;
  const r = lat * Math.PI / 180;
  const y = (1 - Math.log(Math.tan(r) + 1/Math.cos(r)) / Math.PI) / 2 * n;
  return [x * TILE, y * TILE];                  // world pixels
}

let radarFrames = [], radarHost = "", radarPos = 0, radarBuilt = "";
/* The radar used to be a fixed slice of the weather card. Now it is a module
   you can drag and resize, so the tile window has to be recomputed when the
   box changes shape — otherwise the map keeps the geometry it had when the
   page loaded and the track pins drift off their towns. */
if (window.ResizeObserver){
  let rt = null;
  new ResizeObserver(() => {
    clearTimeout(rt);
    rt = setTimeout(() => { radarBuilt = ""; geo = null; buildBase(); }, 250);
  }).observe(document.getElementById("radar"));
}
let geo = null;                     // tile window, shared by both layers

function tileWindow(){
  /* The inner box, not the card: .card is a flex column with padding, so its
     clientWidth is a few pixels wider than the area the tiles actually fill,
     and the pins would sit off by that much. */
  const box = $("#radarBox");
  const w = box.clientWidth, h = box.clientHeight;
  if (!w || !h) return null;
  const vw = w / RS, vh = h / RS;
  const [cx, cy] = project(HOME[0], HOME[1], RZ);
  const ox = cx - vw/2, oy = cy - vh/2;
  return {
    ox, oy,
    x0: Math.floor(ox / TILE), x1: Math.floor((ox + vw) / TILE),
    y0: Math.floor(oy / TILE), y1: Math.floor((oy + vh) / TILE),
  };
}

function place(img, x, y, g){
  img.style.left = (x*TILE - g.ox) + "px";
  img.style.top  = (y*TILE - g.oy) + "px";
  img.width = TILE; img.height = TILE;
}

/* The map stands on its own. It used to be built inside the radar routine,
   which meant a failed RainViewer fetch took the basemap and the track pins
   down with it — the panel just went black. */
function buildBase(){
  geo = tileWindow();
  if (!geo) return false;

  const base = $("#radarBase");
  base.innerHTML = "";
  base.style.transform = "scale(" + RS + ")";
  for (let x = geo.x0; x <= geo.x1; x++)
    for (let y = geo.y0; y <= geo.y1; y++){
      const img = new Image();
      img.src = `https://basemaps.cartocdn.com/dark_all/${RZ}/${x}/${y}.png`;
      place(img, x, y, geo);
      base.appendChild(img);
    }

  const pins = $("#radarPins"); pins.innerHTML = "";
  TRACKS.forEach(([name, lat, lng, ink]) => {
    const [px, py] = project(lat, lng, RZ);
    const el = document.createElement("div");
    el.className = "pin";
    el.style.left = ((px - geo.ox) * RS) + "px";
    el.style.top  = ((py - geo.oy) * RS) + "px";
    el.style.background = ink;
    el.innerHTML = `<b style="color:${ink}">${name.split("-")[0]}</b>`;
    pins.appendChild(el);
  });
  return true;
}

function buildEcho(){
  if (!geo && !buildBase()) return;
  const echo = $("#radarEcho");
  echo.innerHTML = "";
  echo.style.transform = "scale(" + RS + ")";
  radarFrames.forEach((f, i) => {
    for (let x = geo.x0; x <= geo.x1; x++)
      for (let y = geo.y0; y <= geo.y1; y++){
        const img = new Image();
        img.src = `${radarHost}${f.path}/${TILE}/${RZ}/${x}/${y}/4/1_1.png`;
        img.dataset.frame = i;
        place(img, x, y, geo);
        echo.appendChild(img);
      }
  });
  radarPos = radarFrames.length - 1;
  showFrame();
}

function showFrame(){
  const f = radarFrames[radarPos];
  if (!f) return;
  $("#radarEcho").querySelectorAll("img").forEach(im => {
    im.classList.toggle("on", +im.dataset.frame === radarPos);
  });
  const t = new Date(f.time * 1000);
  const hh = t.getHours() % 12 || 12;
  $("#radarTime").textContent =
    `${hh}:${String(t.getMinutes()).padStart(2,"0")} ${t.getHours()<12?"AM":"PM"}`;
}

let radarHold = 0;
function stepRadar(){
  const n = radarFrames.length;
  if (!n) return;
  // Sit on the newest frame for a beat before looping — that one is the
  // current picture, and it's the one worth looking at.
  if (radarPos === n - 1 && radarHold < RADAR_HOLD){ radarHold++; return; }
  radarHold = 0;
  radarPos = (radarPos + 1) % n;
  showFrame();
}
const RADAR_HOLD = 5;                 // ticks to linger on the latest frame
setInterval(stepRadar, 420);

function renderRadar(r){
  if (!geo) buildBase();                          // map first, always
  if (!r || !(r.frames||[]).length){
    $("#radarTime").textContent = "NO RADAR";
    return;
  }
  const sig = r.frames.map(f=>f.path).join("|");
  if (sig === radarBuilt) return;                 // same loop, nothing to do
  radarBuilt = sig;
  radarHost = r.host; radarFrames = r.frames;
  buildEcho();
}

/* Sky canvas: gradient plus whatever is falling. Same six skies as the
   Pixoo, so the two displays never disagree about the weather either. */
const SKIES = {
  clear:["#20548c","#7ba0d0"], cloudy:["#3f4653","#8b93a3"],
  rain:["#16222f","#43566b"],  snow:["#303849","#6b7492"],
  storms:["#1b1b2c","#484464"],night:["#080a22","#30244c"],
};
let sky="clear", tick=0, drops=[];
const cv=$("#sky"), cx=cv.getContext("2d");

function seedDrops(){
  drops = Array.from({length: sky==="storms"?90:56}, ()=>({
    x:Math.random(), y:Math.random(),
    s:(sky==="storms"?.010:.006)*(.5+Math.random()),
  }));
}
function paintSky(){
  const w=cv.width=cv.offsetWidth, h=cv.height=cv.offsetHeight;
  const p=SKIES[sky]||SKIES.clear;
  const g=cx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,p[0]); g.addColorStop(1,p[1]);
  cx.fillStyle=g; cx.fillRect(0,0,w,h);

  /* A clear sky with nothing in it is a void. Give it the thing that makes
     it clear — a low sun, or the moon after dark, breathing slightly. */
  if(sky==="clear"||sky==="night"){
    /* On a narrow card the top-right corner belongs to the wind and rain
       figures, so the sun moves down out of their way. */
    const tight = w < 520;
    const cxp = w*(tight?.72:.78), cyp = h*(tight?.66:.30);
    const br = Math.min(w,h)*(tight?.13:.17);
    const pulse=1+Math.sin(tick/90)*.02;
    const warm = sky==="clear";
    const halo=cx.createRadialGradient(cxp,cyp,0,cxp,cyp,br*3.2*pulse);
    halo.addColorStop(0, warm?"rgba(255,226,150,.34)":"rgba(200,214,255,.20)");
    halo.addColorStop(1, "rgba(0,0,0,0)");
    cx.fillStyle=halo; cx.beginPath(); cx.arc(cxp,cyp,br*3.2,0,7); cx.fill();
    cx.fillStyle = warm?"rgba(255,238,196,.92)":"rgba(226,232,250,.88)";
    cx.beginPath(); cx.arc(cxp,cyp,br*.52*pulse,0,7); cx.fill();
    if(!warm){                                  // bite a crescent out of it
      cx.globalCompositeOperation="destination-out";
      cx.beginPath(); cx.arc(cxp-br*.24,cyp-br*.14,br*.46,0,7); cx.fill();
      cx.globalCompositeOperation="source-over";
    }
  }
  if(sky==="rain"||sky==="storms"){
    cx.strokeStyle="rgba(178,208,245,.75)"; cx.lineWidth=Math.max(1,w/900);
    drops.forEach(d=>{
      const y=((d.y+tick*d.s)%1.2-.1)*h, x=d.x*w;
      cx.beginPath(); cx.moveTo(x,y); cx.lineTo(x+w*.004,y+h*.045); cx.stroke();
    });
  } else if(sky==="snow"){
    cx.fillStyle="rgba(255,255,255,.9)";
    drops.forEach(d=>{
      const y=((d.y+tick*d.s*.4)%1.2-.1)*h;
      const x=(d.x+Math.sin((y/h+d.x)*6)*.012)*w;
      cx.beginPath(); cx.arc(x,y,Math.max(1.2,w/620),0,7); cx.fill();
    });
  } else if(sky==="night"){
    drops.forEach((d,i)=>{
      const tw=(Math.sin(tick/22+i)+1)/2;
      cx.fillStyle="rgba(210,220,255,"+(.25+tw*.6)+")";
      cx.fillRect(d.x*w, d.y*h*.8+h*.1, Math.max(1.4,w/700), Math.max(1.4,w/700));
    });
  }
  tick++; requestAnimationFrame(paintSky);
}

async function load(){
  try{
    const r = await fetch("data/state.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const s = await r.json();
    lastGood = Date.now();
    /* Not just "did the fetch work" — a stale file served happily by nginx
       still parses. The snapshot carries its own write time, so compare
       against that when it's there. */
    if(s.generated){
      const wrote = Date.parse(s.generated);
      if(!isNaN(wrote)) lastGood = Math.min(Date.now(), wrote + 0);
    }
    dim(s.hour);
    renderFlag(s.dirt||{});
    renderRacing(s.dirt||{}, s.nascar);
    renderWeather(s.weather||{});
    renderRadar(s.radar);
    renderServices(s.services);
    renderPihole(s.pihole);
    renderSystem(s.sysnet);
    renderNet(s.sysnet);
    renderMedia(s.jellyfin);
    refreshSlots();      // a stream may have just claimed or freed its slot
    const next = (s.weather||{}).sky || "clear";
    if(next!==sky){ sky=next; seedDrops(); }
  }catch(e){
    /* The board process writes this file. If it's missing, the board is down,
       which is worth saying plainly rather than leaving yesterday on screen. */
    $("#flag").className="offline";
    $("#flagWord").textContent="Board offline";
    $("#flagSub").textContent="No snapshot from the Pi";
  }
}
seedDrops(); paintSky(); buildBase(); load(); setInterval(load, POLL);
armClock();   /* sets the interval and paints immediately */
loadAlerts(); setInterval(loadAlerts, ALERT_POLL);
setInterval(checkStale, 15000);
loadLayout(); setInterval(loadLayout, LAYOUT_POLL);
loadWire(); setInterval(loadWire, WIRE_POLL);
wireTimer = setInterval(cycleWire, WIRE_HOLD);
loadGallery(); setInterval(loadGallery, GALLERY_POLL);
</script>
